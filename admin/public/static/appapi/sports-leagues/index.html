<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sports Top Leagues</title>
    <style>
        body {
            margin: 0;
            padding: 28px 22px;
            background: #f7f7f6;
            color: #414141;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }
        h1 {
            margin: 0 0 18px;
            color: #9a8068;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .league {
            display: flex;
            align-items: center;
            min-height: 74px;
            margin-bottom: 10px;
            padding: 0 22px 0 14px;
            border-radius: 36px;
            background: #eeeeee;
            box-sizing: border-box;
        }
        .league img {
            width: 56px;
            height: 56px;
            margin-right: 18px;
            object-fit: contain;
        }
        .league span {
            font-size: 26px;
            line-height: 1.1;
        }
    </style>
</head>
<body>
    <h1>Top Leagues</h1>
    <div class="league"><img src="./fifa-world-cup.png" alt=""><span>FIFA World Cup</span></div>
    <div class="league"><img src="./premier-league.png" alt=""><span>Premier League</span></div>
    <div class="league"><img src="./la-liga.png" alt=""><span>La Liga</span></div>
    <div class="league"><img src="./serie-a.png" alt=""><span>Serie A</span></div>
    <div class="league"><img src="./bundesliga.png" alt=""><span>Bundesliga</span></div>
    <div class="league"><img src="./ligue-1.png" alt=""><span>Ligue 1</span></div>
    <div class="league"><img src="./j-league.png" alt=""><span>J-League</span></div>
    <div class="league"><img src="./uefa-champions-league.png" alt=""><span>UEFA Champions League</span></div>
    <div class="league"><img src="./uefa-europa-league.png" alt=""><span>UEFA Europa League</span></div>
    <div class="league"><img src="./uefa-conference-league.png" alt=""><span>UEFA Conference League</span></div>
</body>
</html>
