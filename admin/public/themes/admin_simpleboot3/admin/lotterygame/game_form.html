<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
        <li class="active"><a><if condition="$is_edit eq 1">编辑游戏<else/>添加游戏</if></a></li>
    </ul>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{$post_url}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>游戏编码</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="game_code" value="{$data.game_code}" maxlength="60" placeholder="例如 TXFFC">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>游戏名称</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="game_name" value="{$data.game_name}" maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">英文名称</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="game_name_en" value="{$data.game_name_en}" maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">分类</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="category_id">
                    <foreach name="categories" item="category">
                        <option value="{$category.id}" <if condition="$data['category_id'] eq $category['id']">selected</if>>{$category.name}</option>
                    </foreach>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">图标</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="icon" id="game-icon" value="{$data.icon}">
                <div class="form-inline" style="margin-bottom:8px;">
                    <select class="form-control js-lottery-icon-select"
                            data-input="#game-icon"
                            data-preview="#game-icon-preview"
                            style="min-width:260px;">
                        <option value="">选择内置彩票图标</option>
                        <foreach name="icon_choices" item="icon">
                            <option value="{$icon.key}" data-url="{$icon.url}" <if condition="$data['icon'] eq $icon['key']">selected</if>>{$icon.label}</option>
                        </foreach>
                    </select>
                    <span class="help-block" style="display:inline;margin-left:8px;">或上传自定义图片</span>
                </div>
                <a class="js-lottery-icon-upload" data-select=".js-lottery-icon-select" href="javascript:uploadOneImage('游戏图标上传','#game-icon');">
                    <if condition="empty($data.icon_url)">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png"
                             id="game-icon-preview"
                             style="cursor:pointer;width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid #ddd;"/>
                    <else/>
                        <img src="{$data.icon_url}"
                             id="game-icon-preview"
                             style="cursor:pointer;width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid #ddd;"/>
                    </if>
                </a>
                <input type="button" class="btn btn-sm btn-cancel-game-icon" value="取消图标">
                <p class="help-block">建议尺寸：200 X 200。旧文字标识会保留，上传图片后 App 将优先显示图片。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">描述</label>
            <div class="col-md-6 col-sm-10">
                <textarea class="form-control" name="description" rows="3">{$data.description}</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">规则说明</label>
            <div class="col-md-6 col-sm-10">
                <textarea class="form-control" name="rule_desc" rows="4">{$data.rule_desc}</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">开奖间隔</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="interval_sec" value="{$data.interval_sec}" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="9">
                <p class="help-block">单位：秒</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">提前封盘</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="seal_advance_sec" value="{$data.seal_advance_sec}" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="9">
                <p class="help-block">单位：秒，到达封盘时间后停止下注</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">玩法模板</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="template_code">
                    <volist name="template_codes" id="template_name">
                        <option value="{$key}" <if condition="$data['draw_config']['template_code'] eq $key">selected</if>>{$template_name}</option>
                    </volist>
                </select>
                <p class="help-block">用于批量生成默认玩法和赔率，生成后仍可在玩法管理里单独调整。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">开奖号码</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <input type="text" class="form-control" name="draw_count" value="{$data.draw_config.draw_count}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:110px;" placeholder="个数">
                个，
                范围
                <input type="text" class="form-control" name="number_min" value="{$data.draw_config.number_min}" oninput="this.value=this.value.replace(/[^\d-]/g,'')" style="width:110px;" placeholder="最小">
                -
                <input type="text" class="form-control" name="number_max" value="{$data.draw_config.number_max}" oninput="this.value=this.value.replace(/[^\d-]/g,'')" style="width:110px;" placeholder="最大">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">号码格式</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <select class="form-control" name="number_unique" style="width:160px;">
                    <option value="0" <if condition="$data['draw_config']['number_unique'] eq 0">selected</if>>允许重复</option>
                    <option value="1" <if condition="$data['draw_config']['number_unique'] eq 1">selected</if>>不允许重复</option>
                </select>
	                补零宽度
	                <input type="text" class="form-control" name="number_pad" value="{$data.draw_config.number_pad}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:110px;" placeholder="0/2">
	                <p class="help-block">补零宽度为 2 时显示 01、02。</p>
	            </div>
	        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">单次限额</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <input type="text" class="form-control" name="min_bet" value="{$data.min_bet}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:160px;" placeholder="最低">
                -
                <input type="text" class="form-control" name="max_bet" value="{$data.max_bet}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:160px;" placeholder="最高">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">单期限额</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="max_issue_bet" value="{$data.max_issue_bet}" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="12">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="sort" value="{$data.sort}" oninput="this.value=this.value.replace(/[^\d-]/g,'')" maxlength="9">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">开奖引擎</label>
            <div class="col-md-6 col-sm-10">
                <p class="form-control-static">Go 本地定时开奖（不依赖外部数据源）</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="status">
                    <volist name="game_status" id="status_name">
                        <option value="{$key}" <if condition="$data['status'] eq $key">selected</if>>{$status_name}</option>
                    </volist>
                </select>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <if condition="$is_edit eq 1"><input type="hidden" name="id" value="{$data.id}"></if>
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('Lotterygame/index')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
</block>
<block name="scripts">
<script>
    (function(){
        var defaultThumbnail = '__TMPL__/public/assets/images/default-thumbnail.png';
        $('.js-lottery-icon-select').change(function () {
            var $select = $(this);
            var value = $select.val() || '';
            var previewUrl = $select.find('option:selected').data('url') || defaultThumbnail;
            $($select.data('input')).val(value);
            $($select.data('preview')).attr('src', previewUrl);
        });
        $('.js-lottery-icon-upload').click(function () {
            $($(this).data('select')).val('');
        });
        $('.btn-cancel-game-icon').click(function () {
            $('#game-icon-preview').attr('src', defaultThumbnail);
            $('#game-icon').val('');
            $('.js-lottery-icon-select').val('');
        });
    })()
</script>
</block>
