<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
        <li class="active"><a>{$play.play_name}投注项</a></li>
    </ul>

    <div class="margin-top-20">
        <a class="btn btn-default" href="{:url('Lotterygame/plays',array('game_id'=>$game['id']))}">返回玩法</a>
        <a class="btn btn-success" href="{:url('Lotterygame/addOption',array('play_id'=>$play['id']))}">添加投注项</a>
    </div>

    <table class="layui-table js-layui-table margin-top-20" lay-filter="admin-lotterygame-options-1" lay-skin="line">
        <thead>
        <tr>
            <th>ID</th>
            <th>投注项</th>
            <th>赔率</th>
            <th>排序</th>
            <th>状态</th>
            <th align="center">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.option_name}<br><small>{$vo.option_code}</small></td>
                <td>{$vo.odds}</td>
                <td>{$vo.sort}</td>
                <td><if condition="$vo['status'] eq 1"><span class="label label-success">启用</span><else/><span class="label label-default">隐藏</span></if></td>
                <td align="center">
                    <a class="btn btn-xs btn-primary" href="{:url('Lotterygame/editOption',array('id'=>$vo['id']))}">编辑</a>
                    <if condition="$vo['status'] neq 1">
                        <a class="btn btn-xs btn-success js-ajax-dialog-btn" href="{:url('Lotterygame/setOptionStatus',array('id'=>$vo['id'],'status'=>1))}" data-msg="确定启用该投注项？">启用</a>
                    <else/>
                        <a class="btn btn-xs btn-danger js-ajax-dialog-btn" href="{:url('Lotterygame/setOptionStatus',array('id'=>$vo['id'],'status'=>0))}" data-msg="确定隐藏该投注项？">隐藏</a>
                    </if>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
</block>
