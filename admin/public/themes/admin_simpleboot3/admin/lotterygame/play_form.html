<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
        <li class="active"><a><if condition="$is_edit eq 1">编辑玩法<else/>添加玩法</if></a></li>
    </ul>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{$post_url}">
        <div class="form-group">
            <label class="col-sm-2 control-label">游戏</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" value="{$game.game_name}({$game.game_code})" readonly>
                <input type="hidden" name="game_id" value="{$game.id}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>玩法编码</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="play_code" value="{$data.play_code}" maxlength="60" placeholder="例如 DRAGON_TIGER_1_5">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>玩法名称</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="play_name" value="{$data.play_name}" maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">结算规则</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="result_rule">
                    <volist name="play_rule" id="rule_name">
                        <option value="{$key}" <if condition="$data['result_rule'] eq $key">selected</if>>{$rule_name}</option>
                    </volist>
                </select>
                <p class="help-block">后台按该规则判断投注项是否中奖；投注项编码需和规则匹配。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">排序</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="sort" value="{$data.sort}" oninput="this.value=this.value.replace(/[^\d-]/g,'')" maxlength="9">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">状态</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="status">
                    <option value="1" <if condition="$data['status'] eq 1">selected</if>>启用</option>
                    <option value="0" <if condition="$data['status'] eq 0">selected</if>>隐藏</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <if condition="$is_edit eq 1"><input type="hidden" name="id" value="{$data.id}"></if>
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('Lotterygame/plays',array('game_id'=>$game['id']))}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
</block>
