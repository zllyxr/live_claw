<!DOCTYPE html>
<html>
<head>
    <include file="appapi@head"/>
    <title>游戏下注</title>
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body { margin: 0; background: #f5f7fb; color: #25222a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
        .page { min-height: 100vh; padding: 12px 12px 138px; }
        .hero { position: relative; border-radius: 12px; padding: 16px; color: #fff; background: linear-gradient(135deg, #20335f 0%, #8d4fd6 46%, #ff805c 100%); box-shadow: 0 12px 28px rgba(93, 69, 172, .24); overflow: hidden; }
        .hero:before { content: ""; position: absolute; inset: -42px -34px auto auto; width: 150px; height: 150px; border-radius: 50%; border: 24px solid rgba(255,255,255,.09); transform: rotate(18deg); }
        .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .game-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .game-icon { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.22); display: none; }
        .game-name { font-size: 16px; font-weight: 700; line-height: 1.25; }
        .game-meta { margin-top: 7px; font-size: 12px; opacity: .92; }
        .visual-strip { position: relative; margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 54px; }
        .visual-tag { min-width: 42px; height: 34px; padding: 0 12px; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; color: #5b3bc0; background: #fff; font-weight: 800; box-shadow: 0 6px 14px rgba(42, 25, 96, .18); }
        .hero-badge { flex: 0 0 auto; padding: 7px 10px; border-radius: 14px; background: rgba(255,255,255,.18); font-size: 9px; }
        .wallet, .issue, .panel, .play { margin-top: 10px; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #e9edf4; }
        .wallet { display: flex; justify-content: space-between; align-items: center; font-size:12px; }
        .wallet span { color: #3568d4; font-weight: 700; }
        .issue-title, .panel-title, .play-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
        .refresh { border: 1px solid #ff8abd; color: #f44791; background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
        .issue-body { margin-top: 8px; color: #626b7a; font-size: 13px; line-height: 1.6; }
        .issue-body.active { color: #4f3aac; font-weight: 700; }
        .last-code { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .result-track { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .result-token { position: relative; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
        .visual-strip .result-token { width: 52px; height: 52px; }
        .result-token img { width: 100%; height: 100%; display: block; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(22, 25, 49, .18)); }
        .result-token.dice-token { animation: diceTumble .72s cubic-bezier(.2,.8,.24,1) both; }
        .result-token.card-token { width: 34px; height: 48px; animation: cardFlip .72s cubic-bezier(.2,.8,.24,1) both; }
        .visual-strip .result-token.card-token { width: 40px; height: 56px; }
        .result-token.number-token { min-width: 34px; width: auto; height: 34px; padding: 0 10px; border-radius: 17px; color: #3568d4; background: #eef4ff; font-weight: 800; box-shadow: inset 0 0 0 1px #d9e6ff; font-size:12px}
        .result-token:nth-child(2) { animation-delay: .06s; }
        .result-token:nth-child(3) { animation-delay: .12s; }
        .result-token:nth-child(4) { animation-delay: .18s; }
        .result-token:nth-child(5) { animation-delay: .24s; }
        .result-token:nth-child(6) { animation-delay: .30s; }
        .history-code { flex: 1; min-width: 0; justify-content: flex-end; }
        @keyframes diceTumble {
            0% { transform: translateY(-8px) rotateX(96deg) rotateZ(-22deg) scale(.72); opacity: 0; }
            72% { transform: translateY(2px) rotateX(-8deg) rotateZ(4deg) scale(1.05); opacity: 1; }
            100% { transform: translateY(0) rotateX(0) rotateZ(0) scale(1); opacity: 1; }
        }
        @keyframes cardFlip {
            0% { transform: rotateY(88deg) translateY(-4px); opacity: 0; }
            70% { transform: rotateY(-10deg) translateY(1px); opacity: 1; }
            100% { transform: rotateY(0) translateY(0); opacity: 1; }
        }
        .analysis-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .metric { padding: 10px; border-radius: 8px; background: #f6f8fc; }
        .metric-label { color: #6d7480; font-size: 12px; }
        .metric-value { margin-top: 4px; color: #22304d; font-size: 18px; font-weight: 700; }
        .number-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .number-chip { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: #ff6a9c; font-size: 13px; font-weight: 800; box-shadow: 0 6px 14px rgba(255, 106, 156, .2); }
        .number-chip img { width: 28px; height: 28px; object-fit: contain; }
        .number-chip.card-mini { width: 28px; height: 38px; padding: 0; border-radius: 6px; background: transparent; box-shadow: none; }
        .number-chip.card-mini img { width: 28px; height: 38px; }
        .number-chip.cold { background: #39a8a1; box-shadow: 0 6px 14px rgba(57, 168, 161, .18); }
        .plays { margin-top: 10px; }
        .play-title { margin-bottom: 10px; }
        .play-title span { display: inline-flex; align-items: center; gap: 7px; }
        .play-icon { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: #3568d4; }
        .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .option { min-height: 58px; border-radius: 10px; border: 1px solid #dfe6f2; background: #fff; color: #2d3442; font-size: 14px; display: flex; align-items: center; gap: 9px; padding: 8px 10px; text-align: left; }
        .option-symbol { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #5b3bc0; background: #f2efff; font-weight: 900; overflow: hidden; }
        .option-symbol.text { font-size: 13px; letter-spacing: 0; }
        .option-symbol.color-red { color: #fff; background: #e93d4d; }
        .option-symbol.color-blue { color: #fff; background: #3568d4; }
        .option-symbol.color-green { color: #fff; background: #129b77; }
        .option-symbol img { width: 100%; height: 100%; object-fit: contain; }
        .option-symbol.card { width: 26px; height: 36px; border-radius: 6px; background: transparent; }
        .option-symbol.card img { width: 26px; height: 36px; }
        .option-text { min-width: 0; flex: 1; }
        .option strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
        .option em { display: block; margin-top: 3px; color: #8d96a6; font-style: normal; font-size: 12px; }
        .option.active { border-color: #7c55f2; color: #5b3bc0; background: #f7f3ff; font-weight: 700; box-shadow: 0 8px 18px rgba(88, 67, 198, .12); }
        .option.active .option-symbol { animation: cardFlip .45s ease both; }
        .betbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.98); border-top: 1px solid #e9edf4; box-shadow: 0 -4px 18px rgba(35, 45, 70, .08); }
        .selected-summary { min-height: 20px; margin-bottom: 8px; color: #4d5564; font-size: 12px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-bottom: 8px; }
        .quick { height: 34px; border: 1px solid #dfe6f2; border-radius: 17px; color: #2d3442; background: #fff; font-weight: 700; font-size: 12px;}
        .quick.active { color: #fff; border-color: #ff5fa6; background: #ff5fa6; }
        .bet-row { display: flex; gap: 8px; }
        .amount { width: 34%; min-width: 104px; height: 44px; border: 1px solid #cfd8e8; border-radius: 22px; padding: 0 12px; font-size: 16px; outline: none; }
        .submit { flex: 1; height: 44px; border: 0; border-radius: 22px; color: #fff; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #ff4fa3, #ff8f4f); }
        .submit:disabled { opacity: .45; }
        .empty { padding: 30px 12px; color: #999; text-align: center; }
        .history { margin-top: 12px; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #ffe0ef; }
        .history-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .history-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #f5edf2; font-size: 13px; color: #555; }
        .history-row:first-of-type { border-top: 0; }
        .records { margin-top: 12px; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #e9edf4; }
        .record { padding: 10px 0; border-top: 1px solid #eef1f6; }
        .record:first-of-type { border-top: 0; }
        .record-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; color: #22304d; }
        .record-meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; color: #6d7480; font-size: 12px; }
        .record-stats { margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
        .record-stat { padding: 8px; border-radius: 8px; background: #f6f8fc; }
        .record-stat span { display: block; color: #7a8290; font-size: 11px; }
        .record-stat strong { display: block; margin-top: 3px; color: #22304d; font-size: 14px; }
        .profit-win { color: #f04438 !important; }
        .profit-lose { color: #129b77 !important; }
        .record-items { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .record-item { padding: 8px; border-radius: 8px; background: #fff9fc; color: #4d5564; font-size: 12px; line-height: 1.5; }
        .record-status { flex: 0 0 auto; color: #f44791; }
        .toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); max-width: 80%; padding: 10px 14px; border-radius: 20px; color: #fff; background: rgba(0,0,0,.76); font-size: 14px; display: none; z-index: 9; }
        body.is-loading .hero-badge,
        body.is-loading .wallet,
        body.is-loading .issue,
        body.is-loading .panel,
        body.is-loading .plays,
        body.is-loading .history,
        body.is-loading .records,
        body.is-loading .betbar,
        body.is-error .betbar { display: none; }
        .overlay-tools { display: none; }
        body.overlay-mode { width: 100vw; min-height: 100vh; overflow: hidden; background: transparent; color: #fff; }
        body.overlay-mode .page { position: fixed; left: 0; right: 0; bottom: 0; width: 100vw; height: 62vh; min-height: 430px; padding: 12px 12px 142px; border-radius: 26px 26px 0 0; background: rgba(24, 18, 18, .62); box-shadow: 0 -14px 38px rgba(0,0,0,.28); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
        body.overlay-mode .hero { padding: 0; border-radius: 0; background: transparent; box-shadow: none; overflow: visible; }
        body.overlay-mode .hero:before { display: none; }
        body.overlay-mode .hero-top { align-items: center; }
        body.overlay-mode .game-icon { width: 62px; height: 62px; flex-basis: 62px; border-radius: 50%; display: block; background: rgba(255,255,255,.16); box-shadow: 0 10px 22px rgba(0,0,0,.22); }
        body.overlay-mode .game-name { color: #fff; font-size: 20px; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
        body.overlay-mode .game-meta { color: rgba(255,255,255,.76); font-size: 12px; }
        body.overlay-mode .hero-badge { color: rgba(255,255,255,.8); background: rgba(255,255,255,.12); }
        body.overlay-mode .visual-strip { justify-content: flex-end; min-height: 38px; margin-top: 8px; gap: 6px; }
        body.overlay-mode .visual-strip .result-token { width: 34px; height: 34px; }
        body.overlay-mode .result-token.number-token { min-width: 31px; height: 31px; padding: 0 8px; border-radius: 9px; color: #fff; background: rgba(53,104,212,.88); box-shadow: none; font-size: 12px; }
        body.overlay-mode .result-token.dice-token,
        body.overlay-mode .result-token.card-token { filter: drop-shadow(0 6px 12px rgba(0,0,0,.28)); }
        body.overlay-mode .overlay-tools { display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        body.overlay-mode .overlay-tool { height: 38px; border: 1px solid rgba(255,255,255,.36); border-radius: 9px; color: #fff; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 900; }
        body.overlay-mode .overlay-tool.square { font-size: 20px; }
        body.overlay-mode .overlay-tool.active { border-color: rgba(255,255,255,.82); background: rgba(255,255,255,.2); }
        body.overlay-mode .wallet,
        body.overlay-mode .issue,
        body.overlay-mode .panel,
        body.overlay-mode .play,
        body.overlay-mode .history,
        body.overlay-mode .records { border-color: rgba(255,255,255,.16); background: rgba(22,22,24,.42); color: #fff; box-shadow: none; }
        body.overlay-mode .wallet { padding: 8px 10px; color: rgba(255,255,255,.74); }
        body.overlay-mode .wallet span { color: #ffe27a; }
        body.overlay-mode .issue { padding: 9px 10px; }
        body.overlay-mode .issue-title,
        body.overlay-mode .panel-title,
        body.overlay-mode .play-title,
        body.overlay-mode .history-title { color: #fff; }
        body.overlay-mode .issue-body { color: rgba(255,255,255,.76); }
        body.overlay-mode .issue-body.active { color: #67ff52; }
        body.overlay-mode .refresh { color: #fff; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.1); }
        body.overlay-mode #analysisBox,
        body.overlay-mode #historyBox,
        body.overlay-mode #recordsBox { display: none !important; }
        body.overlay-mode.show-analysis #analysisBox,
        body.overlay-mode.show-history #historyBox,
        body.overlay-mode.show-records #recordsBox { display: block !important; }
        body.overlay-mode .analysis-grid { gap: 7px; }
        body.overlay-mode .metric,
        body.overlay-mode .record-stat { background: rgba(255,255,255,.1); }
        body.overlay-mode .metric-label,
        body.overlay-mode .record-meta,
        body.overlay-mode .record-stat span,
        body.overlay-mode .option em { color: rgba(255,255,255,.62); }
        body.overlay-mode .metric-value,
        body.overlay-mode .record-stat strong,
        body.overlay-mode .record-head { color: #fff; }
        body.overlay-mode .play { padding: 10px; }
        body.overlay-mode .play-icon { background: rgba(53,104,212,.88); }
        body.overlay-mode .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        body.overlay-mode .option { min-height: 82px; padding: 12px 10px; border-color: rgba(255,255,255,.2); border-radius: 10px; background: rgba(34,36,40,.55); color: #fff; flex-direction: column; justify-content: center; text-align: center; gap: 7px; }
        body.overlay-mode .option-symbol { background: rgba(255,255,255,.12); color: #fff; }
        body.overlay-mode .option strong { color: #fff; font-size: 21px; }
        body.overlay-mode .option.active { border-color: rgba(106,165,255,.92); background: rgba(31,74,142,.58); color: #fff; box-shadow: 0 0 0 1px rgba(106,165,255,.42), 0 10px 24px rgba(0,0,0,.2); }
        body.overlay-mode .option.active strong { color: #9fc6ff; }
        body.overlay-mode .option.active:nth-child(2n) strong { color: #ff6f70; }
        body.overlay-mode .history-row { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.74); }
        body.overlay-mode .record { border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.06); }
        body.overlay-mode .record-item { background: rgba(255,255,255,.08); color: rgba(255,255,255,.76); }
        body.overlay-mode .betbar { padding: 9px 12px calc(9px + env(safe-area-inset-bottom)); background: rgba(20, 17, 18, .72); border-top: 1px solid rgba(255,255,255,.12); box-shadow: 0 -10px 22px rgba(0,0,0,.22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        body.overlay-mode .selected-summary { color: rgba(255,255,255,.78); }
        body.overlay-mode .quick { border-color: rgba(255,255,255,.18); color: #fff; background: rgba(255,255,255,.08); }
        body.overlay-mode .quick.active { border-color: #ffe27a; color: #25222a; background: #ffe27a; }
        body.overlay-mode .amount { border-color: rgba(255,255,255,.18); color: #ffe27a; background: rgba(255,255,255,.1); }
        body.overlay-mode .amount::placeholder { color: rgba(255,255,255,.52); }
        body.overlay-mode .submit { background: linear-gradient(135deg, #2869ff, #684bff); box-shadow: 0 10px 22px rgba(35,83,255,.25); }
        body.overlay-mode .toast { bottom: calc(104px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.74); }
        body.overlay-mode .page { scrollbar-width: none; }
        body.overlay-mode .page::-webkit-scrollbar { display: none; width: 0; height: 0; }
        @media (max-width: 380px) {
            body.overlay-mode .page { height: 64vh; min-height: 420px; }
            body.overlay-mode .overlay-tools { grid-template-columns: 36px repeat(3, minmax(0, 1fr)); gap: 6px; }
            body.overlay-mode .overlay-tool { font-size: 12px; }
            body.overlay-mode .option strong { font-size: 19px; }
        }
    </style>
</head>
<body class="is-loading <if condition="$overlay eq '1'">overlay-mode</if>">
<div class="page">
    <section class="hero">
        <div class="hero-top">
            <div class="game-title-wrap">
                <img class="game-icon" id="gameIcon" src="" alt="">
                <div>
                    <div class="game-name" id="gameName" data-i18n="loading">加载中</div>
                    <div class="game-meta" id="gameMeta" data-i18n="reading_config">正在读取游戏配置</div>
                </div>
            </div>
            <div class="hero-badge" id="heroBadge" data-i18n="official_sync">官方同步</div>
        </div>
        <div class="visual-strip" id="visualStrip"></div>
    </section>
    <div class="overlay-tools" id="overlayTools">
        <button class="overlay-tool square" id="helpBtn" type="button">?</button>
        <button class="overlay-tool" data-panel="analysis" type="button">走势图</button>
        <button class="overlay-tool" data-panel="records" type="button">投注记录</button>
        <button class="overlay-tool" data-panel="history" type="button">开奖记录</button>
    </div>

    <section class="wallet">
        <div data-i18n="balance">可用余额</div>
        <span id="coin">--</span>
    </section>

    <section class="issue">
        <div class="issue-title">
            <span data-i18n="current_issue">当前期号</span>
            <button class="refresh" id="refreshBtn" type="button" data-i18n="refresh">刷新</button>
        </div>
        <div class="issue-body" id="issueText" data-i18n="loading">加载中</div>
    </section>

    <section class="panel" id="lastBox" style="display:none;">
        <div class="panel-title">
            <span data-i18n="latest_draw">最新开奖</span>
            <small id="lastIssue"></small>
        </div>
        <div class="last-code" id="lastCode"></div>
    </section>

    <section class="panel" id="analysisBox" style="display:none;">
        <div class="panel-title">
            <span data-i18n="trend_analysis">走势分析</span>
            <small id="analysisSummary"></small>
        </div>
        <div class="analysis-grid">
            <div class="metric">
                <div class="metric-label" data-i18n="big_rate">大号占比</div>
                <div class="metric-value" id="bigRate"></div>
            </div>
            <div class="metric">
                <div class="metric-label" data-i18n="odd_rate">单号占比</div>
                <div class="metric-value" id="oddRate"></div>
            </div>
        </div>
        <div class="metric-label" style="margin-top:10px;" data-i18n="hot_numbers">热号</div>
        <div class="number-row" id="hotNumbers"></div>
        <div class="metric-label" style="margin-top:10px;" data-i18n="cold_numbers">冷号</div>
        <div class="number-row" id="coldNumbers"></div>
    </section>

    <section class="plays" id="plays"></section>

    <section class="history" id="historyBox" style="display:none;">
        <div class="history-title" data-i18n="draw_history">开奖记录</div>
        <div id="history"></div>
    </section>

    <section class="records" id="recordsBox" style="display:none;">
        <div class="panel-title">
            <span data-i18n="betting_records">投注记录</span>
            <small id="recordsSummary"></small>
        </div>
        <div id="records"></div>
    </section>

    <div class="betbar">
        <div class="selected-summary" id="selectedSummary" data-i18n="choose_option">请选择投注项</div>
        <div class="quick-amounts" id="quickAmounts"></div>
        <div class="bet-row">
            <input class="amount" id="amount" type="number" min="1" value="" placeholder="输入金额" data-i18n-placeholder="amount_placeholder">
            <button class="submit" id="submitBtn" type="button" data-i18n="submit_bet" disabled>确认下注</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    var uid = {$uid_json|default='""'};
    var token = {$token_json|default='""'};
    var authFragment = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    uid = uid || authFragment.get('uid') || '';
    token = token || authFragment.get('token') || '';
    var language_type = {$language_json|default='""'};
    var liveuid = {$liveuid_json|default='""'};
    var stream = {$stream_json|default='""'};
    var overlayMode = {$overlay_json|default='false'} || new URLSearchParams(location.search).get('overlay') === '1';
    var gameId = {$game_id_json|default='"0"'};
    var gameCode = {$game_code_json|default='""'};
    var apiBase = location.origin + '/core-api/appapi/';
    var assetBase = '/static/appapi/lottery-icons/svg/';
    var cardSuits = ['spades', 'hearts', 'clubs', 'diamonds'];
    var selectedIssueId = '';
        var selectedOption = null;
        var refreshTimer = null;
        var currentGame = null;
        var currentVisualMode = '';

            var dict = isEnglish() ? I18N.en : I18N.zh;

            data = data || {};
            Object.keys(data).forEach(function (name) {
                text = text.replace(new RegExp('\\{' + name + '\\}', 'g'), data[name]);
            });
            return text;

        function setOverlayPanel(panel) {
            if (!overlayMode) {

            });
            document.querySelectorAll('.overlay-tool[data-panel]').forEach(function (button) {
                button.classList.toggle('active', button.getAttribute('data-panel') === panel);
            });

        function localized(obj, defaultKey, englishKey, fallback) {
            if (!obj) {
                return fallback || '';
            }
            var value = isEnglish() ? obj[englishKey] : '';
            if (!value) {
                value = obj[defaultKey];
            }
            return value || fallback || '';
        }

        function serverMessage(message, fallbackKey) {
            if (!message) {
                return t(fallbackKey);
            }
            if (!isEnglish()) {
                return message;
            }
            if (message.indexOf('下注失败:') === 0) {
                return t('bet_failed') + ': ' + message.substring('下注失败:'.length);
            }
            var map = {
                '请求失败': 'Request failed',
                '游戏不存在或已下架': 'Game not found or offline',
                '游戏加载失败': 'Failed to load game',

                '余额不足': 'Insufficient balance'
            };
            return map[message] || t(fallbackKey);

        function api(service, params) {
            var search = new URLSearchParams(params || {});
            search.set('service', service);
            search.set('language', language_type || new URLSearchParams(location.search).get('language') || '');
	        return fetch(apiBase, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: search.toString(), credentials: 'same-origin' })
                .then(function (res) { return res.text(); })
                .then(function (text) {
                    var json = null;
                    try {
                        json = JSON.parse(text);
                    } catch (e) {
                        throw new Error(t('request_failed'));
                    }
                    var data = json.data || {};
                    if (String(data.code) !== '0') {
                        throw new Error(serverMessage(data.msg, 'request_failed'));
                    }
                    var info = data.info || [];
                    return info[0] || null;
            });
    }

    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg || '';
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(function () { el.style.display = 'none'; }, 1800);
    }

    function loadDetail() {
        return api('LotteryGame.detail', {
            uid: uid || '',
            token: token || '',
            game_id: gameId || 0,
            game_code: gameCode || ''
            }).then(function (detail) {
                if (!detail || !detail.game) {
                    renderEmpty(t('game_not_found'));
                    return;
                }
                renderGame(detail);
            }).catch(function (err) {
                renderEmpty(serverMessage(err.message, 'game_load_failed'));
            });
        }

        function renderGame(detail) {
                var game = detail.game || {};
                currentGame = game;
                currentVisualMode = visualMode(game, collectDetailNumbers(detail));
            document.body.classList.remove('is-loading', 'is-error');
            renderQuickAmounts(game);
                document.getElementById('gameName').textContent = localized(game, 'game_name', 'game_name_en', t('game_default'));
            document.getElementById('gameMeta').textContent = (game.game_code || '') + ' · ' + t('min_bet') + ' ' + (game.min_bet || '10');
            document.getElementById('heroBadge').textContent = game.last_issue_num ? t('official_issue', {issue: game.last_issue_num}) : t('waiting_sync');
        renderGameIcon(game);
        var coinText = detail.coin === undefined || detail.coin === null || String(detail.coin).length < 1 ? '0' : detail.coin;
        document.getElementById('coin').textContent = coinText;
        applyIssue(detail.current_issue);
        renderVisualStrip(game, detail.history || []);
        renderLastDraw(game);
        renderAnalysis(detail.analysis);
        renderPlays(detail.plays || []);
        renderHistory(detail.history || []);
        loadOrders();
        }

        function renderEmpty(text) {
            document.body.classList.remove('is-loading');
            document.body.classList.add('is-error');
            document.getElementById('gameName').textContent = t('game_bet');
            document.getElementById('gameMeta').textContent = text;
        document.getElementById('gameIcon').style.display = 'none';
        document.getElementById('heroBadge').textContent = '';
        document.getElementById('visualStrip').innerHTML = '';
        document.getElementById('issueText').textContent = text;
        document.getElementById('plays').innerHTML = '<div class="empty">' + text + '</div>';
        document.getElementById('recordsBox').style.display = 'none';
        document.getElementById('submitBtn').disabled = true;
    }

    function renderQuickAmounts(game) {
        var minBet = Number(game && game.min_bet);
        if (!isFinite(minBet) || minBet <= 0) {
            minBet = 10;
        }
        var amounts = [minBet, minBet * 5, minBet * 10, minBet * 50].filter(function (amount, index, list) {
            return list.indexOf(amount) === index;
        });
        document.getElementById('quickAmounts').innerHTML = amounts.map(function (amount, index) {
            var value = String(Math.round(amount * 100) / 100);
            return '<button class="quick' + (index === 0 ? ' active' : '') + '" type="button" data-amount="' + escapeHtml(value) + '">' + escapeHtml(value) + '</button>';
        }).join('');
        document.getElementById('amount').value = String(Math.round(minBet * 100) / 100);
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (char) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char];
        });
    }

    function renderGameIcon(game) {
        var icon = document.getElementById('gameIcon');
        var iconUrl = (game && (game.icon_url || (/^https?:\/\//.test(game.icon || '') ? game.icon : ''))) || '';
        if (!iconUrl) {
            icon.style.display = 'none';
            icon.removeAttribute('src');
            return;
        }
        icon.src = iconUrl;
        icon.style.display = 'block';
    }

    function splitCode(code) {
        if (!code) {
            return [];
        }
        return String(code).split(/,|，|\s+/).filter(function (item) {
            return item && /^[-]?\d+$/.test(item);
        });
    }

    function numberValue(value) {
        var number = parseInt(String(value || '').replace(/[^\d-]/g, ''), 10);
        return isNaN(number) ? null : number;
    }

        function cardRank(number) {
            if (number === 1) {
                return 'A';
        }
        if (number === 11) {
            return 'J';
        }
        if (number === 12) {
            return 'Q';
        }
        if (number === 13) {
            return 'K';
        }
            return String(number);
        }

        function cardAsset(number, index) {
            if (number === 0) {
                return assetBase + 'playing_cards_54/' + (Math.abs(index || 0) % 2 ? 'joker_black' : 'joker_red') + '.svg';
            }
            return assetBase + 'playing_cards_54/' + cardRank(number) + '_' + cardSuit(index || number) + '.svg';
        }

        function addVisualNumber(list, value) {
            if (typeof value === 'string' && /,|，|\s+/.test(value)) {
                splitCode(value).forEach(function (item) { addVisualNumber(list, item); });
                return;
            }
            var number = numberValue(value);
            if (number !== null) {
                list.push(number);
            }
        }

        function isElementPlay(play) {
            var code = String((play && play.play_code) || '').toUpperCase();
            var rule = String((play && play.result_rule) || '').toLowerCase();
            return false;
        }

        function collectDetailNumbers(detail) {
            var values = [];
            var game = (detail && detail.game) || {};
            splitCode(game.last_open_code || '').forEach(function (item) { addVisualNumber(values, item); });
            ((detail && detail.history) || []).forEach(function (row) {
                splitCode(row.open_code || '').forEach(function (item) { addVisualNumber(values, item); });
            });
            var analysis = (detail && detail.analysis) || {};
            (analysis.hot_numbers || []).forEach(function (item) { addVisualNumber(values, item.number); });
            (analysis.cold_numbers || []).forEach(function (item) { addVisualNumber(values, item.number); });
            ((detail && detail.plays) || []).forEach(function (play) {
                if (!isElementPlay(play)) {
                    return;
                }
                (play.options || []).forEach(function (option) {
                    addVisualNumber(values, optionNumber(option));
                });
            });
            return values;
        }

        function explicitVisualMode(game) {
            var text = [
                (game && game.game_code) || gameCode || '',
                game && game.game_name,
                game && game.game_name_en
            ].join(' ').toUpperCase();
            if (text.indexOf('CARD') >= 0 || text.indexOf('POKER') >= 0 || text.indexOf('扑克') >= 0 || text.indexOf('牌') >= 0) {
                return 'card';
            }
            if (text.indexOf('K3') >= 0 || text.indexOf('KS') >= 0 || text.indexOf('DICE') >= 0 || text.indexOf('骰') >= 0) {
                return 'dice';
            }
            if (text.indexOf('PK10') >= 0 || text.indexOf('飞艇') >= 0 || text.indexOf('赛车') >= 0 || text.indexOf('六合彩') >= 0 || text.indexOf('11选5') >= 0 || text.indexOf('快乐') >= 0) {
                return 'number';
            }
            if (/\bPK\b/.test(text)) {
                return 'number';
            }
            return '';
        }

        function visualMode(game, nums) {
            var explicit = explicitVisualMode(game || {});
            if (explicit) {
                return explicit;
            }
            return 'number';
        }

    function cardSuit(index) {
        return cardSuits[Math.abs(index) % cardSuits.length];
    }

    function assetImg(src, alt) {
        return '<img src="' + src + '" alt="' + escapeHtml(alt) + '">';
    }

        function renderResultToken(value, index, mode, compact) {
            var number = numberValue(value);
            if (number !== null && mode === 'dice' && number >= 1 && number <= 6) {
            return '<span class="result-token dice-token' + (compact ? ' compact' : '') + '">' +
                assetImg(assetBase + 'dice_6_faces/dice_' + number + '.svg', value) +
                '</span>';
        }
            if (number !== null && mode === 'card' && number >= 1 && number <= 13) {
                return '<span class="result-token card-token' + (compact ? ' compact' : '') + '">' +
                    assetImg(cardAsset(number, index), value) +
                    '</span>';
            }
            if (number === 0 && mode === 'card') {
                return '<span class="result-token card-token' + (compact ? ' compact' : '') + '">' +
                    assetImg(cardAsset(number, index), value) +
                    '</span>';
            }
            return '<span class="result-token number-token">' + escapeHtml(value) + '</span>';
        }

        function renderResultTrack(code, game, className, limit) {
            var nums = Array.isArray(code) ? code : splitCode(code);
            var mode = currentVisualMode || visualMode(game || currentGame || {}, nums);
        return '<div class="result-track ' + (className || '') + '">' + nums.slice(0, limit || 20).map(function (item, index) {
            return renderResultToken(item, index, mode, false);
        }).join('') + '</div>';
    }

    function renderPreviewTrack(game, history) {
        var code = (game && game.last_open_code) || (history[0] && history[0].open_code) || '';
        var nums = splitCode(code).slice(0, 10);
        if (nums.length) {
            return renderResultTrack(nums, game, 'hero-result', 10);
        }
        return '';
    }

    function renderVisualStrip(game, history) {
        var box = document.getElementById('visualStrip');
        var html = renderPreviewTrack(game || {}, history || []);
        box.innerHTML = html;
        box.style.display = html ? 'flex' : 'none';
    }

    function renderLastDraw(game) {
        var code = splitCode(game.last_open_code || '');
        if (!code.length) {
            document.getElementById('lastBox').style.display = 'none';
            return;
        }
        document.getElementById('lastBox').style.display = 'block';
        document.getElementById('lastIssue').textContent = game.last_issue_num || '';
        document.getElementById('lastCode').innerHTML = renderResultTrack(code, game, 'last-result', 20);

    function renderAnalysis(analysis) {
        if (!analysis || String(analysis.sample_count || '0') === '0') {
            document.getElementById('analysisBox').style.display = 'none';
            return;
        }
            document.getElementById('analysisBox').style.display = 'block';
            document.getElementById('analysisSummary').textContent = analysis.sample_count > 0 ? t('last_count_stats', {count: analysis.sample_count}) : t('no_history_stats');
        document.getElementById('bigRate').textContent = (analysis.trend && analysis.trend.big_rate) || '0%';
        document.getElementById('oddRate').textContent = (analysis.trend && analysis.trend.odd_rate) || '0%';
        document.getElementById('hotNumbers').innerHTML = renderNumberChips(analysis.hot_numbers || [], '');
        document.getElementById('coldNumbers').innerHTML = renderNumberChips(analysis.cold_numbers || [], ' cold');
    }

        function renderNumberChips(list, className) {
            var mode = currentVisualMode || visualMode(currentGame || {}, list.map(function (item) { return item.number; }));
        return list.map(function (item) {
            var number = numberValue(item.number);
            if (number !== null && mode === 'dice' && number >= 1 && number <= 6) {
                return '<span class="number-chip' + className + '">' +
                    assetImg(assetBase + 'dice_6_faces/dice_' + number + '.svg', item.number) +
                    '</span>';
            }
                if (number !== null && mode === 'card' && number >= 1 && number <= 13) {
                    return '<span class="number-chip card-mini' + className + '">' +
                        assetImg(cardAsset(number, number), item.number) +
                        '</span>';
                }
                if (number === 0 && mode === 'card') {
                    return '<span class="number-chip card-mini' + className + '">' +
                        assetImg(cardAsset(number, number), item.number) +
                        '</span>';
                }
                return '<span class="number-chip' + className + '">' + escapeHtml(item.number) + '</span>';
        }).join('');
    }

    function refreshIssue() {
        return api('LotteryGame.currentIssue', {
            game_id: gameId || 0,
            game_code: gameCode || ''
            }).then(applyIssue).catch(function (err) {
                toast(serverMessage(err.message, 'issue_refresh_failed'));
            });
        }

    function applyIssue(issue) {
        var canBet = issue && String(issue.can_bet) === '1';
        selectedIssueId = canBet ? String(issue.id || '') : '';
            var text = t('no_bettable_issue');
            if (issue) {
                text = t('issue_text', {issue: issue.issue_num || '--', seconds: issue.bet_countdown || '0'});
                if (!canBet) {
                    text += ' · ' + t('sealed');
                }
            }
        document.getElementById('issueText').textContent = text;
        document.getElementById('issueText').classList.toggle('active', !!canBet);
        document.getElementById('submitBtn').disabled = !canBet;
    }

        function optionNumber(option) {
            var parts = [option && option.option_code, option && option.option_name, option && option.option_name_en];
            for (var i = 0; i < parts.length; i++) {
                var match = String(parts[i] || '').match(/(^|[^0-9])([0-9]{1,3})([^0-9]|$)/);
                if (match) {
                    return parseInt(match[2], 10);
                }
        }
        return null;
    }

        function optionSymbol(option, play) {
            var number = optionNumber(option);
            var mode = currentVisualMode || visualMode(currentGame || {}, number === null ? [] : [String(number)]);
            var name = localized(option, 'option_name', 'option_name_en', option.option_code || '');
            var rule = String((play && play.result_rule) || '').toLowerCase();
            var optionCode = String((option && option.option_code) || '').toUpperCase();
            if (rule === 'lhc_special_color') {
                var colorClass = optionCode === 'RED' ? ' color-red' : (optionCode === 'BLUE' ? ' color-blue' : ' color-green');
                return '<span class="option-symbol text' + colorClass + '">' + escapeHtml(String(name || optionCode).slice(0, 1)) + '</span>';
            }
            if (!isElementPlay(play)) {
                var label = String(name || option.option_code || '').trim();
                return '<span class="option-symbol text">' + escapeHtml(label ? label.slice(0, 2) : playIcon(play)) + '</span>';
            }
            if (number !== null && mode === 'dice' && number >= 1 && number <= 6) {
                return '<span class="option-symbol dice">' + assetImg(assetBase + 'dice_6_faces/dice_' + number + '.svg', name) + '</span>';
            }
            if (number !== null && mode === 'card' && number >= 1 && number <= 13) {
                return '<span class="option-symbol card">' + assetImg(cardAsset(number, number), name) + '</span>';
            }
            if (number === 0 && mode === 'card') {
                return '<span class="option-symbol card">' + assetImg(cardAsset(number, number), name) + '</span>';
            }
        var text = String(name || option.option_code || '').trim();
        return '<span class="option-symbol text">' + escapeHtml(text ? text.slice(0, 2) : playIcon(play)) + '</span>';
    }

    function renderPlays(plays) {
        var box = document.getElementById('plays');
            selectedOption = null;
            if (!plays.length) {
                box.innerHTML = '<div class="empty">' + escapeHtml(t('no_plays')) + '</div>';
                return;
            }
            box.innerHTML = plays.map(function (play) {
                var options = (play.options || []).map(function (option) {
                    return '<button class="option" type="button" data-option-id="' + option.id + '">' +
                        optionSymbol(option, play) +
                        '<span class="option-text"><strong>' + escapeHtml(localized(option, 'option_name', 'option_name_en', option.option_code)) + '</strong>' +
                        '<em>' + escapeHtml(option.odds) + t('times') + '</em></span></button>';
                }).join('');
                return '<section class="play"><div class="play-title"><span><i class="play-icon">' +
                    playIcon(play) + '</i>' + escapeHtml(localized(play, 'play_name', 'play_name_en', play.play_code)) + '</span><small>' +
                    escapeHtml(play.play_code || '') + '</small></div><div class="options">' + options + '</div></section>';
        }).join('');

        var optionMap = {};
        plays.forEach(function (play) {
            (play.options || []).forEach(function (option) {
                var item = {};
                Object.keys(option || {}).forEach(function (key) { item[key] = option[key]; });
                item.play_code = play.play_code || '';
                item.play_name = localized(play, 'play_name', 'play_name_en', play.play_code || '');
                item.result_rule = play.result_rule || '';
                optionMap[String(option.id)] = item;
            });
        });
        box.querySelectorAll('.option').forEach(function (button, index) {
            button.addEventListener('click', function () {
                box.querySelectorAll('.option.active').forEach(function (active) { active.classList.remove('active'); });
                button.classList.add('active');
                selectedOption = optionMap[String(button.dataset.optionId)] || null;
                renderSelectedSummary();
            });
            if (index === 0) {
                button.click();
            }
        });
    }

    function renderSelectedSummary() {
        var box = document.getElementById('selectedSummary');
        if (!selectedOption) {
            box.textContent = t('choose_option');
            return;
        }
        var optionName = localized(selectedOption, 'option_name', 'option_name_en', selectedOption.option_code || '');
        box.textContent = selectedOption.play_name + ' / ' + optionName + ' @ ' + (selectedOption.odds || '--');
    }

    function renderHistory(history) {
        if (!history.length) {
            return;
        }
        document.getElementById('historyBox').style.display = 'block';
        document.getElementById('history').innerHTML = history.slice(0, 10).map(function (row) {
            return '<div class="history-row"><span>' + escapeHtml(row.issue_num || '--') + '</span>' +
                renderResultTrack(row.open_code || '', currentGame || {}, 'history-code', 12) +
                '</div>';
        }).join('');
    }

    function loadOrders() {
        if (!uid || !token) {
            document.getElementById('recordsBox').style.display = 'none';
            return Promise.resolve();
        }
        return api('LotteryGame.orderList', {
            uid: uid,
            token: token,
            game_id: gameId || 0,
            game_code: gameCode || '',
            p: 1
        }).then(function (result) {
            renderOrders((result && result.list) || []);
            }).catch(function (err) {
                document.getElementById('recordsBox').style.display = 'block';
                document.getElementById('recordsSummary').textContent = '';
                document.getElementById('records').innerHTML = '<div class="empty">' + escapeHtml(serverMessage(err.message, 'records_load_failed')) + '</div>';
            });
        }

    function renderOrders(orders) {
        var box = document.getElementById('recordsBox');
            var list = document.getElementById('records');
            box.style.display = 'block';
            document.getElementById('recordsSummary').textContent = orders.length ? t('recent_count', {count: orders.length}) : '';
            if (!orders.length) {
                list.innerHTML = '<div class="empty">' + escapeHtml(t('no_bet_records')) + '</div>';
                return;
            }
        list.innerHTML = orders.map(function (order) {
            var profit = Number(order.profit_loss || order.net_amount || 0);
                var profitClass = profit > 0 ? 'profit-win' : (profit < 0 ? 'profit-lose' : '');
                var items = (order.items || []).map(function (item) {
                    return '<div class="record-item">' +
                        escapeHtml(item.play_code || item.play_name || '') + ' · ' + escapeHtml(localized(item, 'option_name', 'option_name_en', item.option_code || '')) +
                        ' / ' + t('bet') + ' ' + money(item.bet_amount) +
                        ' / ' + t('odds') + ' ' + escapeHtml(item.odds || '--') +
                        ' / ' + t('payout') + ' ' + money(item.payout_amount) +
                        '</div>';
                }).join('');
                return '<article class="record">' +
                    '<div class="record-head"><span>' + escapeHtml(localized(order, 'game_name', 'game_name_en', order.game_code || t('lottery'))) + '</span><span class="record-status">' + escapeHtml(isEnglish() ? (order.status_text_en || order.status_text || '') : (order.status_text || '')) + '</span></div>' +
                    '<div class="record-meta"><span>' + t('issue') + ' ' + escapeHtml(order.issue_num || '--') + '</span><span>' + escapeHtml(order.bet_time_text || '') + '</span></div>' +
                    '<div class="record-stats">' +
                        '<div class="record-stat"><span>' + t('total_bet') + '</span><strong>' + money(order.total_bet) + '</strong></div>' +
                        '<div class="record-stat"><span>' + t('total_payout') + '</span><strong>' + money(order.total_payout) + '</strong></div>' +
                        '<div class="record-stat"><span>' + t('profit_loss') + '</span><strong class="' + profitClass + '">' + signedMoney(profit) + '</strong></div>' +
                '</div>' +
                '<div class="record-items">' + items + '</div>' +
                '</article>';
        }).join('');
    }

    function money(value) {
        var number = Number(value || 0);
        if (!isFinite(number)) {
            number = 0;
        }
        return number.toFixed(number % 1 === 0 ? 0 : 2);
    }

    function signedMoney(value) {
        var number = Number(value || 0);
        var prefix = number > 0 ? '+' : '';
        return prefix + money(number);
    }

    function playIcon(play) {
        var code = String((play && play.play_code) || '').toUpperCase();
        var rule = String((play && play.result_rule) || '').toLowerCase();
        if (rule.indexOf('dragon_tiger') === 0) {
            return '龙';
        }
        if (rule.indexOf('k3_') === 0 || rule === 'contains_number') {
            return '骰';
        }
        if (rule.indexOf('lhc_special_color') === 0) {
            return '波';
        }
        if (rule.indexOf('lhc_special_zodiac') === 0) {
            return '肖';
        }
        if (rule.indexOf('lhc_special_number') === 0) {
            return '码';
        }
            if (code.indexOf('ODD') >= 0) {
                return t('odd') + t('even');
            }
            return t('big') + t('small');
        }

        function submitBet() {
            if (!uid || !token) {
                toast(t('please_login'));
                return;
            }
            if (!selectedIssueId) {
                toast(t('no_bettable_issue'));
                return;
            }
            if (!selectedOption) {
                toast(t('choose_option'));
                return;
            }
            var amount = Number(document.getElementById('amount').value || 0);
            if (amount <= 0) {
                toast(t('input_amount'));
                return;
            }
        var items = JSON.stringify([{ option_id: selectedOption.id, amount: amount }]);
        document.getElementById('submitBtn').disabled = true;
        api('LotteryGame.bet', {
            uid: uid,
            token: token,
            game_id: gameId || 0,
            issue_id: selectedIssueId,
            client_trace_id: 'H5_' + Date.now() + '_' + selectedOption.id,
            items: items
        }).then(function (result) {
                toast(t('bet_success'));
            if (result && result.coin !== undefined) {
                document.getElementById('coin').textContent = result.coin;
            }
            return refreshIssue().then(loadOrders);
            }).catch(function (err) {
                toast(serverMessage(err.message, 'bet_failed'));
        }).finally(function () {
            document.getElementById('submitBtn').disabled = !selectedIssueId;
        });
    }

        applyI18n();
    if (overlayMode) {
        document.body.classList.add('overlay-mode');
    }
        document.getElementById('refreshBtn').addEventListener('click', refreshIssue);
    document.getElementById('submitBtn').addEventListener('click', submitBet);
    document.getElementById('overlayTools').addEventListener('click', function (event) {
        var button = event.target;
        if (!button || !button.classList || !button.classList.contains('overlay-tool')) {
            return;
        }
        if (button.id === 'helpBtn') {
            toast(currentGame && currentGame.rule_desc ? currentGame.rule_desc : (currentGame && currentGame.game_name ? currentGame.game_name : t('game_bet')));
            return;
        }
        setOverlayPanel(button.getAttribute('data-panel') || '');
    });
    document.getElementById('quickAmounts').addEventListener('click', function (event) {
        var target = event.target;
        if (!target || !target.dataset || !target.dataset.amount) {
            return;
        }
        document.querySelectorAll('.quick.active').forEach(function (button) { button.classList.remove('active'); });
        target.classList.add('active');
        document.getElementById('amount').value = target.dataset.amount;
    });
    document.getElementById('amount').addEventListener('input', function () {
        var amount = this.value;
        document.querySelectorAll('.quick').forEach(function (button) {
            button.classList.toggle('active', button.dataset.amount === amount);
        });
    });
    loadDetail().then(function () {
        if (currentGame) {
            refreshTimer = setInterval(refreshIssue, 3000);
        }
    });
    window.addEventListener('beforeunload', function () {
        if (refreshTimer) {
            clearInterval(refreshTimer);
        }
    });
</script>
</body>
</html>
