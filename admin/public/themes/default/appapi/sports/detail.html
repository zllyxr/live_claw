<!DOCTYPE html>
<html>
<head>
    <include file="appapi@head"/>
    <title>比赛详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green-deep: #063b2c;
            --green: #0b7a52;
            --green-bright: #12a06b;
            --lime: #c9ff43;
            --ink: #10241d;
            --ink-2: #5f6f68;
            --ink-3: #93a29b;
            --bg: #eef4f1;
            --surface: #ffffff;
            --line: #e2ebe6;
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .page {
            min-height: 100vh;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));
            max-width: 560px;
            margin: 0 auto;
        }

        /* ---------- HERO ---------- */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 20px 18px 0;
            color: #fff;
            background: linear-gradient(138deg, #052e22 0%, #0b6a47 55%, #129e67 100%);
            box-shadow: 0 18px 44px rgba(8, 82, 56, .28);
            animation: heroIn .5s ease both;
        }
        @keyframes heroIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .floodlight {
            position: absolute; inset: -40% -20%;
            background: conic-gradient(from 210deg at 82% 0%, rgba(201,255,67,.16) 0deg, transparent 46deg),
                        conic-gradient(from 130deg at 8% 4%, rgba(255,255,255,.12) 0deg, transparent 40deg);
            animation: sweep 7s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes sweep { from { transform: rotate(-3deg); opacity: .8; } to { transform: rotate(3deg); opacity: 1; } }
        .hero-dots {
            position: absolute; inset: 0; pointer-events: none; opacity: .8;
            background-image: radial-gradient(2px 2px at 18% 22%, rgba(255,255,255,.8), transparent 100%),
                radial-gradient(1.6px 1.6px at 66% 14%, rgba(255,255,255,.5), transparent 100%),
                radial-gradient(2px 2px at 86% 34%, rgba(201,255,67,.7), transparent 100%),
                radial-gradient(1.4px 1.4px at 38% 8%, rgba(255,255,255,.45), transparent 100%);
        }
        .hero-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: rgba(233,255,244,.85); }
        .league-chip {
            display: inline-flex; align-items: center; gap: 6px;
            max-width: 70%; padding: 6px 12px; border-radius: 999px;
            background: rgba(255,255,255,.14); backdrop-filter: blur(6px);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
        }
        .league-chip .ball { flex: 0 0 auto; }
        .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.22); font-weight: 700; white-space: nowrap; }
        .status-chip.live { background: rgba(201,255,67,.2); color: var(--lime); }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); animation: pulse 1.3s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

        .score-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 22px; }
        .team { flex: 1; min-width: 0; text-align: center; }
        .team-logo {
            width: 58px; height: 58px; margin: 0 auto; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 34% 30%, #ffffff, #dff0e8);
            box-shadow: 0 8px 20px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.6);
            font-size: 22px; font-weight: 800; color: var(--green-deep); overflow: hidden;
            animation: float 3.2s ease-in-out infinite;
        }
        .team.away .team-logo { animation-delay: -1.6s; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .team-logo img { width: 40px; height: 40px; object-fit: contain; display: block; }
        .team-name { margin-top: 10px; font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .score-mid { flex: 0 0 132px; text-align: center; }
        .score {
            font-size: 40px; font-weight: 900; letter-spacing: 1px; line-height: 1;
            font-variant-numeric: tabular-nums; text-shadow: 0 4px 18px rgba(0,0,0,.3);
        }
        .score .num { display: inline-block; animation: scorePop .45s ease both; }
        @keyframes scorePop { from { transform: translateY(-10px) scale(1.25); opacity: 0; } to { transform: none; opacity: 1; } }
        .kick-line { margin-top: 8px; font-size: 12px; color: rgba(233,255,244,.8); }
        .countdown { margin-top: 6px; font-size: 12px; color: var(--lime); font-weight: 700; letter-spacing: 1px; }

        /* pitch strip with radar ping */
        .pitch {
            position: relative; margin-top: 20px; height: 84px;
            border-radius: 16px 16px 0 0; overflow: hidden;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 40px, rgba(255,255,255,.02) 40px 80px);
            border-top: 1px solid rgba(255,255,255,.18);
        }
        .pitch svg { display: block; width: 100%; height: 100%; }
        .ping { transform-origin: center; animation: ping 2.6s ease-out infinite; }
        @keyframes ping { 0% { opacity: .9; transform: scale(.2); } 80% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; } }
        .ball-roll { animation: roll 5.5s linear infinite; }
        @keyframes roll { from { transform: translateX(-30px); } to { transform: translateX(390px); } }
        .ball-roll .spin { transform-origin: 0px 64px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- speed divider ---------- */
        .speed { display: flex; align-items: center; gap: 8px; margin: 18px 2px 12px; }
        .speed .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green-bright), rgba(18,160,107,0)); flex: 1; transform: skewX(-24deg); }
        .speed .bar.b2 { flex: 0 0 34px; opacity: .55; }
        .speed .bar.b3 { flex: 0 0 16px; opacity: .3; }
        .speed-label { font-size: 15px; font-weight: 800; white-space: nowrap; }

        /* ---------- bento 非对称信息网格 ---------- */
        .bento { display: grid; grid-template-columns: 1.6fr 1fr; grid-auto-rows: minmax(74px, auto); gap: 10px; }
        .cell {
            position: relative; overflow: hidden; border-radius: 16px; padding: 14px;
            background: var(--surface); box-shadow: 0 6px 20px rgba(14,45,35,.06);
            animation: cellIn .5s ease both;
        }
        .cell:nth-child(2) { animation-delay: .06s; }
        .cell:nth-child(3) { animation-delay: .12s; }
        .cell:nth-child(4) { animation-delay: .18s; }
        @keyframes cellIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        .cell.tall { grid-row: span 2; }
        .cell.wide { grid-column: span 2; }
        .cell h4 { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: 1px; }
        .cell .big { margin-top: 8px; font-size: 19px; font-weight: 800; line-height: 1.25; word-break: break-all; }
        .cell .sub { margin-top: 5px; font-size: 12px; color: var(--ink-2); }
        .cell .corner {
            position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%;
            background: radial-gradient(circle at 34% 34%, rgba(18,160,107,.16), rgba(18,160,107,0) 70%);
        }
        .vs-visual { margin-top: 10px; }
        .vs-visual svg { display: block; width: 100%; height: auto; }
        .form-dot { animation: dotIn .5s ease both; }
        @keyframes dotIn { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

        .status-flag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: #eaf7f1; color: var(--green); }
        .status-flag.closed { background: #f4f1e7; color: #9a8b52; }
        .status-flag.live { background: #e7fbe9; color: #0b8a3c; }

        /* ---------- 数据来源 ---------- */
        .src-note { margin: 14px 4px 0; display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 11px; }
        .src-note .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--green-bright); animation: pulse 2s ease-in-out infinite; }

        /* ---------- 底部双按钮 ---------- */
        .action-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; gap: 12px; align-items: center;
            max-width: 560px; margin: 0 auto;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            background: rgba(255,255,255,.86); backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
        }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            height: 50px; border-radius: 25px; border: 0;
            font-size: 16px; font-weight: 800; cursor: pointer; user-select: none;
            transition: transform .12s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.96); }
        .btn-orders { flex: 1; color: var(--green); background: #fff; border: 2px solid #cfe6db; }
        .btn-bet { flex: 1.7; position: relative; overflow: hidden; color: #062d20; background: linear-gradient(120deg, #c9ff43, #3ee08c 90%); box-shadow: 0 10px 26px rgba(38, 197, 123, .4); }
        .btn-bet .shine { position: absolute; top: 0; bottom: 0; width: 46px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-24deg); animation: shine 2.4s ease-in-out infinite; }
        @keyframes shine { 0% { left: -60px; } 55%, 100% { left: 120%; } }
        .btn svg { flex: 0 0 auto; }

        .toast {
            position: fixed; left: 50%; bottom: 118px; z-index: 40; transform: translateX(-50%) translateY(8px);
            padding: 10px 18px; border-radius: 999px; background: rgba(9, 30, 22, .92); color: #eafff4; font-size: 13px;
            opacity: 0; pointer-events: none; transition: all .25s ease; max-width: 82vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="page">
    <div class="hero" id="hero">
        <div class="floodlight"></div>
        <div class="hero-dots"></div>
        <div class="hero-top">
            <span class="league-chip">
                <svg class="ball" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#eafff4" stroke-width="2"/><path d="M12 8.2 15.4 10.7 14.1 14.6 9.9 14.6 8.6 10.7Z" fill="#eafff4"/></svg>
                <span id="league">加载中…</span>
            </span>
            <span class="status-chip" id="statusChip"><span class="live-dot" id="liveDot" style="display:none"></span><span id="statusText">…</span></span>
        </div>

        <div class="score-row">
            <div class="team home">
                <div class="team-logo" id="homeLogo">主</div>
                <div class="team-name" id="homeName">主队</div>
            </div>
            <div class="score-mid">
                <div class="score"><span class="num" id="homeScore">-</span> : <span class="num" id="awayScore">-</span></div>
                <div class="kick-line" id="kickLine"></div>
                <div class="countdown" id="countdown"></div>
            </div>
            <div class="team away">
                <div class="team-logo" id="awayLogo">客</div>
                <div class="team-name" id="awayName">客队</div>
            </div>
        </div>

        <div class="pitch">
            <svg viewBox="0 0 360 84" preserveAspectRatio="none">
                <line x1="180" y1="6" x2="180" y2="78" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
                <circle cx="180" cy="42" r="17" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
                <circle class="ping" cx="180" cy="42" r="17" fill="none" stroke="#c9ff43" stroke-width="1.6"/>
                <rect x="2" y="20" width="34" height="44" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
                <rect x="324" y="20" width="34" height="44" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
                <g class="ball-roll">
                    <g class="spin">
                        <circle cx="0" cy="64" r="7" fill="#ffffff"/>
                        <path d="M0 59.6 2.6 61.5 1.6 64.6 -1.6 64.6 -2.6 61.5Z" fill="#0b3b2a"/>
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <div class="speed">
        <span class="speed-label">赛事信息</span>
        <span class="bar"></span><span class="bar b2"></span><span class="bar b3"></span>
    </div>

    <div class="bento">
        <div class="cell tall">
            <div class="corner"></div>
            <h4>对阵态势</h4>
            <div class="vs-visual">
                <svg viewBox="0 0 220 150" id="vsSvg">
                    <defs>
                        <linearGradient id="pitchG" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#0d8f5f"/><stop offset="1" stop-color="#0a6b47"/>
                        </linearGradient>
                    </defs>
                    <rect x="4" y="4" width="212" height="142" rx="10" fill="url(#pitchG)"/>
                    <rect x="4" y="4" width="212" height="142" rx="10" fill="none" stroke="rgba(255,255,255,.4)"/>
                    <line x1="110" y1="4" x2="110" y2="146" stroke="rgba(255,255,255,.4)"/>
                    <circle cx="110" cy="75" r="20" fill="none" stroke="rgba(255,255,255,.4)"/>
                    <rect x="4" y="45" width="26" height="60" fill="none" stroke="rgba(255,255,255,.4)"/>
                    <rect x="190" y="45" width="26" height="60" fill="none" stroke="rgba(255,255,255,.4)"/>
                    <g id="homeDots"></g>
                    <g id="awayDots"></g>
                </svg>
            </div>
            <div class="sub" id="vsNote">阵型示意 · 主队 vs 客队</div>
        </div>
        <div class="cell">
            <div class="corner"></div>
            <h4>比赛状态</h4>
            <div><span class="status-flag" id="stateFlag">同步中…</span></div>
            <div class="sub" id="betNote"></div>
        </div>
        <div class="cell">
            <h4>开赛时间</h4>
            <div class="big" id="kickBig">--:--</div>
            <div class="sub" id="kickDate"></div>
        </div>
        <div class="cell wide">
            <h4>赛事 · 国家</h4>
            <div class="big" id="compBig">…</div>
            <div class="sub" id="countrySub"></div>
        </div>
    </div>

    <div class="src-note"><span class="dot"></span><span id="srcNote">数据每 15 秒自动刷新</span></div>
</div>

<div class="action-bar">
    <button class="btn btn-orders" id="btnOrders">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 11h6M9 15h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        订单详情
    </button>
    <button class="btn btn-bet" id="btnBet">
        <span class="shine"></span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8.4 15 10.6 13.9 14.1 10.1 14.1 9 10.6Z" fill="currentColor"/></svg>
        去下注
    </button>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
    var matchId = {$match_id_json|default='""'};
    var uid = {$uid_json|default='""'};
    var token = {$token_json|default='""'};
    var language = {$language_json|default='""'};
    var competitionType = {$competition_type_json|default='""'};

    var authFragment = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    uid = uid || authFragment.get('uid') || '';
    token = token || authFragment.get('token') || '';

    var apiBase = location.origin + '/core-api/appapi/';
    var match = null;
    var lastSync = 0;
    var serverOffsetSeconds = 0;

    function api(service, params) {
        var search = new URLSearchParams(params || {});
        search.set('service', service);
        if (language) { search.set('language', language); }
        return fetch(apiBase, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: search.toString(), credentials: 'same-origin' })
            .then(function (res) { return res.json(); })
            .then(function (json) {
                var data = json.data || {};
                if (String(data.code) !== '0') { throw new Error(data.msg || '请求失败'); }
                return (data.info || [])[0] || null;
            });
    }

    function el(id) { return document.getElementById(id); }
    function text(id, value) { el(id).textContent = value == null ? '' : String(value); }
    function syncServerClock(info) {
        var serverTime = parseInt(info && info.server_time || '0', 10);
        if (serverTime > 0) {
            serverOffsetSeconds = serverTime - Math.floor(Date.now() / 1000);
        }
    }
    function serverNow() {
        return Math.floor(Date.now() / 1000) + serverOffsetSeconds;
    }

    function toast(message) {
        var node = el('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(node._t);
        node._t = setTimeout(function () { node.classList.remove('show'); }, 2200);
    }

    function setLogo(id, url, fallback) {
        var box = el(id);
        if (url) {
            box.innerHTML = '';
            var img = document.createElement('img');
            img.src = url;
            img.onerror = function () { box.textContent = fallback; };
            box.appendChild(img);
        } else {
            box.textContent = fallback;
        }
    }

    function popScore(id, value) {
        var node = el(id);
        if (node.textContent === String(value)) { return; }
        node.textContent = value;
        node.style.animation = 'none';
        void node.offsetWidth;
        node.style.animation = '';
    }

    function renderMatch(data) {
        if (!data) { return; }
        match = data;
        text('league', data.competition_type || data.competition || competitionType || '足球赛事');
        text('homeName', data.home_name || '主队');
        text('awayName', data.away_name || '客队');
        text('vsNote', '阵型示意 · ' + (data.home_name || '主队') + ' vs ' + (data.away_name || '客队'));
        setLogo('homeLogo', data.home_logo, String(data.home_name || '主').slice(0, 1));
        setLogo('awayLogo', data.away_logo, String(data.away_name || '客').slice(0, 1));
        popScore('homeScore', data.home_score == null ? '-' : data.home_score);
        popScore('awayScore', data.away_score == null ? '-' : data.away_score);

        var statusText = data.status_text || '未开赛';
        text('statusText', statusText);
        var live = data.status === '1H' || data.status === '2H' || data.status === 'HT' || data.status === 'LIVE' || data.status === 'ET';
        el('statusChip').classList.toggle('live', live);
        el('liveDot').style.display = live ? '' : 'none';

        text('kickLine', data.kickoff_text || data.match_time || '');
        text('kickBig', data.kickoff_clock_text || '--:--');
        text('kickDate', data.kickoff_date_text || '');
        text('compBig', data.competition_type || data.competition || '—');
        text('countrySub', data.country ? ('国家/地区：' + data.country) : '');

        var flag = el('stateFlag');
        flag.textContent = statusText;
        flag.className = 'status-flag' + (live ? ' live' : (data.bet_status === '2' ? ' closed' : ''));
        text('betNote', data.bet_status === '1' ? '盘口开放中，可前往下注' : (data.bet_status_text || '当前盘口封闭'));
        lastSync = parseInt(data.updated_at_ts || '0', 10) || lastSync;
    }

    function two(n) { return (n < 10 ? '0' : '') + n; }

    function tickCountdown() {
        if (!match) { return; }
        var kick = parseInt(match.kickoff_ts || '0', 10);
        var now = serverNow();
        var target = el('countdown');
        if (kick > now) {
            var diff = kick - now;
            var h = Math.floor(diff / 3600), m = Math.floor(diff % 3600 / 60), s = diff % 60;
            target.textContent = '距开赛 ' + (h > 0 ? h + ':' : '') + two(m) + ':' + two(s);
        } else {
            target.textContent = '';
        }
    }

    function drawFormation() {
        var homeShape = [[16, 75], [40, 30], [40, 60], [40, 90], [40, 120], [66, 40], [66, 75], [66, 110], [92, 30], [92, 75], [92, 120]];
        var awayShape = [[204, 75], [180, 30], [180, 60], [180, 90], [180, 120], [154, 45], [154, 75], [154, 105], [128, 40], [128, 75], [128, 110]];
        var svgNS = 'http://www.w3.org/2000/svg';
        var homeGroup = el('homeDots');
        var awayGroup = el('awayDots');
        homeShape.forEach(function (p, i) {
            var c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 4.6);
            c.setAttribute('fill', '#eafff4');
            c.setAttribute('class', 'form-dot');
            c.style.animationDelay = (i * 45) + 'ms';
            homeGroup.appendChild(c);
        });
        awayShape.forEach(function (p, i) {
            var c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 4.6);
            c.setAttribute('fill', '#c9ff43');
            c.setAttribute('class', 'form-dot');
            c.style.animationDelay = (500 + i * 45) + 'ms';
            awayGroup.appendChild(c);
        });
    }

    function goto(page) {
        var params = new URLSearchParams();
        params.set('match_id', matchId);
        if (language) { params.set('language', language); }
        if (competitionType) { params.set('competition_type', competitionType); }
        var frag = new URLSearchParams();
        if (uid) { frag.set('uid', uid); }
        if (token) { frag.set('token', token); }
        var url = location.origin + '/appapi/sports/' + page + '?' + params.toString();
        var hash = frag.toString();
        location.href = hash ? url + '#' + hash : url;
    }

    el('btnBet').addEventListener('click', function () {
        if (!uid || !token) { toast('请先登录后再下注'); return; }
        goto('bet');
    });
    el('btnOrders').addEventListener('click', function () {
        if (!uid || !token) { toast('请先登录后查看订单'); return; }
        goto('orders');
    });

    function load() {
        api('Sports.matchDetail', { match_id: matchId }).then(function (info) {
            syncServerClock(info);
            renderMatch(info && info.match);
        }).catch(function (err) { toast(err.message || '加载失败'); });
    }

    function poll() {
        api('Sports.matchUpdates', { match_id: matchId, since: lastSync }).then(function (info) {
            syncServerClock(info);
            if (info && String(info.changed) === '1' && info.match) { renderMatch(info.match); }
        }).catch(function () {});
    }

    drawFormation();
    load();
    setInterval(poll, 15000);
    setInterval(tickCountdown, 1000);
})();
</script>
</body>
</html>
