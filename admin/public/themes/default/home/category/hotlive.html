<include file="public@head"/>

<title>{$site_seo_title} - {$configpub['site_name']}</title>

<link type="text/css" rel="stylesheet" href="__STATIC__/home/css/index.css"/>
<link type="text/css" rel="stylesheet" href="__STATIC__/home/css/hotlive.css"/>
<style type="text/css">
	.feed-list .feed{
		height: 310px;
	}
</style>
</head>
<body>
<div class="wrapper">
	<include file="public@header"/>
	<div id="doc-bd">
		<div class="container clearfix">
			<div class="main clearfix">

				<div class="g-box feed-list" >
					
					<div class="top_nav">
						首页 - <span>{$site_seo_title}</span>
					</div>	
					<p class="clearboth"></p>
					<div class="box-bd">
						<ul class="list">
							<volist name="lists" id="v">
							

							<li class="feed <if condition="$v['islive'] eq '1'">live<else/></if> "><a class="link" href="/{$v['uid']}" target="_blank"><img class="screenshot thumb" src="__STATIC__/home/images/lazyload.png" data-original="{:get_upload_path($v['thumb'])}"/>
							<div class="user">
								<div class="user_left fl"><img class="avatar thumb" src="__STATIC__/home/images/lazyload.png" data-original="{:get_upload_path($v['avatar'])}"/></div>
								<div class="user_right fl">
									<p class="username">{$v['user_nickname']}</p>
									<p class="bottom">
										<span class="type">{$v['signature']}</span>
										<span class="nums">{$v['nums']}</span>
									</p>
								</div>
								
							</div>
							
							</a></li>
							</volist>
						</ul>
					</div>
					<div class="pagination">{$page}</div>
				</div>
			</div>
		</div>
	</div>
<include file="public@footer"/>
<include file="public@scripts"/>

<script>
$(function(){
	//图片延迟加载
	$("img.thumb").lazyload({effect: "fadeIn"});		
})
</script>
</body>
</html>
