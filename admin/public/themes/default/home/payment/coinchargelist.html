<include file="public@head"/>
<title>充值明细</title>
<link type="text/css" rel="stylesheet" href="__STATIC__/home/css/payment.css"/>
<style type="text/css">
	.main{
		background: #FFF;
		height: 630px;
	}
	.pagination{
		padding: 20px 0;
	}
</style>
</head>
<body>

<include file="public@header"/>

<div class="wrapper">


<div id="doc-bd">
    <div id="charge-container" class="container clearfix">
        <div class="side">
            <ul class="sidebar">
                <li>
                    <a href="/home/payment/index">星币充值</a>
                </li>
                <li class="active">
                    <a href="#">充值明细</a>
                </li>
            </ul>
        </div>
        <div class="main">
            <div class="coin_record_list">
            	<ul>
            		<li>
            			<p>{$name_coin}数</p>
            			<p>充值星币</p>
            			<p>充值时间</p>
            			<div class="clearboth"></div>
            		</li>
            		<foreach name="lists" id="vo">
	            		<li>
	            			<p>{$vo['coin']}</p>
	            			<p>{$vo['money']}</p>
	            			<p>{$vo['addtime']}</p>
	            			<div class="clearboth"></div>
	            		</li>
            		</foreach>
            	</ul>
            	<div class="pagination">{$page}</div>
            </div>
        </div>
    </div>
</div>

</div>
<include file="public@footer"/>
<include file="public@scripts"/>

<script type="text/javascript" src="__STATIC__/home/js/payment.js?t=1570610246"></script>

</body>
</html>
