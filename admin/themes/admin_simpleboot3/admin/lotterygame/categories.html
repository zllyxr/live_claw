<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
    </ul>

    <div class="margin-top-20">
        <a class="btn btn-success" href="{:url('Lotterygame/addCategory')}">添加分类</a>
    </div>

    <table class="layui-table js-layui-table margin-top-20" lay-filter="admin-lotterygame-categories-1" lay-skin="line">
        <thead>
        <tr>
            <th>ID</th>
            <th>分类名称</th>
            <th>英文名称</th>
            <th>图标</th>
            <th>排序</th>
            <th>状态</th>
            <th align="center">{:lang('ACTIONS')}</th>
        </tr>
        </thead>
        <tbody>
        <foreach name="list" item="vo">
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.name}</td>
                <td>{$vo.name_en}</td>
                <td>
                    <if condition="!empty($vo.icon_url)">
                        <img src="{$vo.icon_url}" style="width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid #ddd;">
                    <else/>
                        <span class="text-muted">{$vo.icon|default='-'}</span>
                    </if>
                </td>
                <td>{$vo.sort}</td>
                <td><if condition="$vo['status'] eq 1"><span class="label label-success">启用</span><else/><span class="label label-default">隐藏</span></if></td>
                <td align="center">
                    <a class="btn btn-xs btn-primary" href="{:url('Lotterygame/editCategory',array('id'=>$vo['id']))}">编辑</a>
                    <if condition="$vo['status'] neq 1">
                        <a class="btn btn-xs btn-success js-ajax-dialog-btn" href="{:url('Lotterygame/setCategoryStatus',array('id'=>$vo['id'],'status'=>1))}" data-msg="确定启用该分类？">启用</a>
                    <else/>
                        <a class="btn btn-xs btn-danger js-ajax-dialog-btn" href="{:url('Lotterygame/setCategoryStatus',array('id'=>$vo['id'],'status'=>0))}" data-msg="确定隐藏该分类？">隐藏</a>
                    </if>
                </td>
            </tr>
        </foreach>
        </tbody>
    </table>
    <div class="pagination">{$page}</div>
</div>
</block>
