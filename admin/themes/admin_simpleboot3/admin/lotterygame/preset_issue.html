<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
        <li class="active"><a>预设开奖</a></li>
    </ul>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{$post_url}">
        <div class="form-group">
            <label class="col-sm-2 control-label">游戏</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" value="{$game.game_name}({$game.game_code})" readonly>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">期号</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" value="{$issue.issue_num}" readonly>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">开奖时间</label>
            <div class="col-md-6 col-sm-10">
                <if condition="$issue['open_time'] gt 0">
                    <input type="text" class="form-control" value="{:date('Y-m-d H:i:s',$issue['open_time'])}" readonly>
                <else/>
                    <input type="text" class="form-control" value="-" readonly>
                </if>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">号码规则</label>
            <div class="col-md-6 col-sm-10">
                <if condition="$config['number_unique'] eq 1">
                    <input type="text" class="form-control" value="{$config.draw_count} 个，范围 {$config.number_min}-{$config.number_max}，不允许重复" readonly>
                <else/>
                    <input type="text" class="form-control" value="{$config.draw_count} 个，范围 {$config.number_min}-{$config.number_max}，允许重复" readonly>
                </if>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>开奖号码</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="open_code" value="{$preset.open_code}" maxlength="100" placeholder="例如：01,02,03">
                <p class="help-block">多个号码用英文逗号分隔；保存后 worker 到开奖时间会优先使用该号码。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">备注</label>
            <div class="col-md-6 col-sm-10">
                <textarea class="form-control" name="remark" rows="3">{$preset.remark}</textarea>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="hidden" name="issue_id" value="{$issue.id}">
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('Lotterygame/issues',array('game_id'=>$game['id']))}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
</block>
