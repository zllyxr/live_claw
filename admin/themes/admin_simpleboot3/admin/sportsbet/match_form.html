<extend name="public@layout" />
<block name="main">
<div class="wrap">
    <ul class="layui-tab-title">
        <foreach name="nav_tabs" item="tab" key="tab_key">
            <li <if condition="$active_tab eq $tab_key">class="active"</if>><a href="{$tab.url}">{$tab.title}</a></li>
        </foreach>
        <li class="active"><a><if condition="$is_edit eq 1">编辑比赛<else/>添加比赛</if></a></li>
    </ul>

    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{$post_url}">
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>数据源</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="source" value="{$data.source}" maxlength="40">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>上游赛事ID</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="source_match_id" value="{$data.source_match_id}" maxlength="80">
                <p class="help-block">用户可见赛事编号为上游赛事ID，例如 1880731。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">赛事</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="competition" value="{$data.competition}" maxlength="160">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">赛事类型</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="competition_type" value="{$data.competition_type}" maxlength="160">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">国家/地区</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="country" value="{$data.country}" maxlength="80">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>主队</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="home_name" value="{$data.home_name}" maxlength="160">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>客队</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="away_name" value="{$data.away_name}" maxlength="160">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label"><span class="form-required">*</span>开赛时间</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control js-bootstrap-datetime" name="kickoff_time_text" value="{$data.kickoff_time_text}" style="width:220px;">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">提前封盘</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="seal_advance_sec" value="{$data.seal_advance_sec}" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="9">
                <p class="help-block">体育投注固定至少提前 300 秒停止投注。</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">比分</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <input type="text" class="form-control" name="home_score" value="{$data.home_score}" style="width:90px;" placeholder="主队">
                :
                <input type="text" class="form-control" name="away_score" value="{$data.away_score}" style="width:90px;" placeholder="客队">
                <span class="help-inline">未出比分填 -1</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">比赛状态</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <input type="text" class="form-control" name="status" value="{$data.status}" style="width:120px;" maxlength="30">
                <input type="text" class="form-control" name="status_text" value="{$data.status_text}" style="width:220px;" maxlength="80">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">投注状态</label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control" name="bet_status">
                    <volist name="bet_status" id="status_name">
                        <option value="{$key}" <if condition="$data['bet_status'] eq $key">selected</if>>{$status_name}</option>
                    </volist>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">单次限额</label>
            <div class="col-md-6 col-sm-10 form-inline">
                <input type="text" class="form-control" name="min_bet" value="{$data.min_bet}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:160px;">
                -
                <input type="text" class="form-control" name="max_bet" value="{$data.max_bet}" oninput="this.value=this.value.replace(/\D/g,'')" style="width:160px;">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">单场限额</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" name="max_match_bet" value="{$data.max_match_bet}" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="12">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <if condition="$is_edit eq 1"><input type="hidden" name="id" value="{$data.id}"></if>
                <button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
                <a class="btn btn-default" href="{:url('Sportsbet/index')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
</block>
