<!DOCTYPE html>
<html>
    <head>
        <include file="appapi@head"/>
        <title>{:lang("下载APP")}</title>
        <link href='__STATIC__/appapi/css/agent.css?t=1561712926' rel="stylesheet" type="text/css" >
    </head>
<body class="downapp_bg">
    <div class="downapp_logo">
        <img src="/logo.png">
    </div>
    <div class="downapp_name">
        {$site_name}
    </div>
    <div class="downapp_desc">
        <img src="__STATIC__/appapi/images/agent/{:lang('downapp_desc')}.png">
    </div>
    <div class="downapp_btn" id="downloadButton">
        {:lang("点击下载")}
    </div>

	<include file="appapi@footer"/>
	<if condition="$openinstall_appkey neq ''">
	<script type="text/javascript" charset="UTF-8" src="https://web.cdn.openinstall.io/openinstall.js"></script>
	</if>
	<script type="text/javascript">

	    var inviteData = {
	        code: "{$invite_ref|default=''}",
	        ref: "{$invite_ref|default=''}",
	        click_id: "{$click_id|default=''}"
	    };
	    var openinstallAppKey = "{$openinstall_appkey|default=''}";
	    var downloadUrl = "{$download_url|default=''}";
	    var androidUrl = "{$download_url_android|default=''}";
	    var iosUrl = "{$download_url_ios|default=''}";

	    function fallbackDownload() {
	        var ua = navigator.userAgent || "";
	        var target = /iphone|ipad|ipod/i.test(ua) ? iosUrl : androidUrl;
	        window.location.href = target || downloadUrl || "/appapi/down/index";
	    }

	    if (openinstallAppKey && window.OpenInstall) {
	        var data = OpenInstall.parseUrlParams();
	        data.code = inviteData.code;
	        data.ref = inviteData.ref;
	        data.click_id = inviteData.click_id;
	        new OpenInstall({
	            appKey : openinstallAppKey,
	            onready : function() {
	                this.schemeWakeup();
	                var m = this, button = document.getElementById("downloadButton");
	                button.onclick = function() {
	                    m.wakeupOrInstall();
	                    return false;
	                }
	            }
	        }, data);
	    } else {
	        document.getElementById("downloadButton").onclick = function() {
	            fallbackDownload();
	            return false;
	        };
	    }
	</script>
	</body>
	</html>
