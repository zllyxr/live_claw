<!DOCTYPE html>
<html>
<head>
    <include file="appapi@head"/>
    <title>投注记录</title>
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body { margin: 0; background: #f7f8fb; color: #25222a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
        .page { min-height: 100vh; padding: 12px; }
        .hero { border-radius: 12px; padding: 16px; color: #fff; background: linear-gradient(135deg, #3568d4, #ff6a9c); box-shadow: 0 8px 24px rgba(64, 88, 160, .2); }
        .title { font-size: 22px; font-weight: 700; line-height: 1.25; }
        .sub { margin-top: 7px; font-size: 13px; opacity: .9; }
        .summary { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .metric { padding: 10px; border-radius: 10px; background: rgba(255,255,255,.16); }
        .metric span { display: block; font-size: 11px; opacity: .86; }
        .metric strong { display: block; margin-top: 4px; font-size: 17px; }
        .toolbar { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid #e9edf4; }
        .toolbar span { color: #6d7480; font-size: 13px; }
        .refresh { flex: 0 0 auto; border: 1px solid #ff8abd; color: #f44791; background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
        .list { margin-top: 10px; }
        .record { margin-bottom: 10px; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #e9edf4; }
        .record-head { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; color: #22304d; }
        .record-status { flex: 0 0 auto; color: #f44791; }
        .record-meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 8px; color: #6d7480; font-size: 12px; }
        .record-stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
        .record-stat { padding: 8px; border-radius: 8px; background: #f6f8fc; }
        .record-stat span { display: block; color: #7a8290; font-size: 11px; }
        .record-stat strong { display: block; margin-top: 3px; color: #22304d; font-size: 14px; }
        .profit-win { color: #f04438 !important; }
        .profit-lose { color: #129b77 !important; }
        .record-items { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .record-item { padding: 8px; border-radius: 8px; background: #fff9fc; color: #4d5564; font-size: 12px; line-height: 1.5; }
        .empty { padding: 38px 12px; color: #999; text-align: center; }
        .load-more { width: 100%; height: 42px; border: 0; border-radius: 21px; color: #fff; background: #3568d4; font-size: 15px; font-weight: 700; }
        .load-more:disabled { opacity: .45; }
        .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: 80%; padding: 10px 14px; border-radius: 20px; color: #fff; background: rgba(0,0,0,.76); font-size: 14px; display: none; z-index: 9; }
        body.overlay-mode { width: 100vw; min-height: 100vh; overflow: hidden; background: transparent; color: #fff; }
        body.overlay-mode .page { position: fixed; left: 0; right: 0; bottom: 0; width: 100vw; height: 62vh; min-height: 430px; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: rgba(24, 18, 18, .62); box-shadow: 0 -14px 38px rgba(0,0,0,.28); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
        body.overlay-mode .hero { border-radius: 16px; background: rgba(255,255,255,.1); box-shadow: none; }
        body.overlay-mode .toolbar,
        body.overlay-mode .record { border-color: rgba(255,255,255,.16); background: rgba(22,22,24,.42); color: #fff; }
        body.overlay-mode .toolbar span,
        body.overlay-mode .record-meta,
        body.overlay-mode .record-stat span,
        body.overlay-mode .record-item { color: rgba(255,255,255,.68); }
        body.overlay-mode .record-head,
        body.overlay-mode .record-stat strong { color: #fff; }
        body.overlay-mode .record-stat,
        body.overlay-mode .record-item { background: rgba(255,255,255,.08); }
        body.overlay-mode .refresh { color: #fff; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.1); }
        body.overlay-mode .load-more { background: linear-gradient(135deg, #2869ff, #684bff); }
        body.overlay-mode .empty { color: rgba(255,255,255,.72); }
        body.overlay-mode .page { scrollbar-width: none; }
        body.overlay-mode .page::-webkit-scrollbar { display: none; width: 0; height: 0; }
    </style>
</head>
<body class="<if condition="$overlay eq '1'">overlay-mode</if>">
<div class="page">
    <section class="hero">
        <div class="title" id="title" data-i18n="betting_records">投注记录</div>
        <div class="sub" id="subtitle" data-i18n="loading_records">正在读取记录</div>
        <div class="summary">
            <div class="metric"><span data-i18n="total_bet">总投注</span><strong id="totalBet">0</strong></div>
            <div class="metric"><span data-i18n="total_payout">总派彩</span><strong id="totalPayout">0</strong></div>
            <div class="metric"><span data-i18n="total_profit_loss">总盈亏</span><strong id="profitLoss">0</strong></div>
        </div>
    </section>

    <section class="toolbar">
        <span id="scope" data-i18n="all_lottery">全部彩票</span>
        <button class="refresh" id="refreshBtn" type="button" data-i18n="refresh">刷新</button>
    </section>

    <main class="list" id="list"></main>
    <button class="load-more" id="loadMore" type="button" style="display:none;" data-i18n="load_more">加载更多</button>
</div>
<div class="toast" id="toast"></div>

<script>
    var uid = {$uid_json|default='""'};
    var token = {$token_json|default='""'};
    var authFragment = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    uid = uid || authFragment.get('uid') || '';
    token = token || authFragment.get('token') || '';
    var language_type = {$language_json|default='""'};
    var overlayMode = {$overlay_json|default='false'} || new URLSearchParams(location.search).get('overlay') === '1';
    var gameId = {$game_id_json|default='"0"'};
    var gameCode = {$game_code_json|default='""'};
    var apiBase = location.origin + '/core-api/appapi/';
    var page = 1;
	    var loading = false;
	    var finished = false;
	    var orders = [];
        var I18N = {
            zh: {
                page_title: '投注记录',
                betting_records: '投注记录',
                loading_records: '正在读取记录',
                total_bet: '总投注',
                total_payout: '总派彩',
                total_profit_loss: '总盈亏',
                refresh: '刷新',
                load_more: '加载更多',
                all_lottery: '全部彩票',
                request_failed: '请求失败',
                login_required_records: '请先登录后查看投注记录',
                records_load_failed: '记录加载失败',
                game_record_suffix: '记录',
                current_game_only: '只显示当前彩票的下注与结算',
                all_game_records: '全部彩票下注与结算',
                no_bet_records: '暂无投注记录',
                bet: '投',
                odds: '赔率',
                payout: '派彩',
                issue: '期号',
                bet_amount: '投注额',
                profit_loss: '盈亏',
                lottery: '彩票'
            },
            en: {
                page_title: 'Betting Records',
                betting_records: 'Betting Records',
                loading_records: 'Loading records',
                total_bet: 'Total Bet',
                total_payout: 'Total Payout',
                total_profit_loss: 'Total P/L',
                refresh: 'Refresh',
                load_more: 'Load More',
                all_lottery: 'All Lotteries',
                request_failed: 'Request failed',
                login_required_records: 'Please log in to view betting records',
                records_load_failed: 'Failed to load records',
                game_record_suffix: ' Records',
                current_game_only: 'Showing bets and settlement for this lottery only',
                all_game_records: 'All lottery bets and settlement',
                no_bet_records: 'No betting records',
                bet: 'Bet',
                odds: 'Odds',
                payout: 'Payout',
                issue: 'Issue',
                bet_amount: 'Bet Amount',
                profit_loss: 'P/L',
                lottery: 'Lottery'
            }
        };

        function isEnglish() {
            var lang = String(language_type || new URLSearchParams(location.search).get('language') || navigator.language || '').toLowerCase();
            return lang.indexOf('en') === 0;
        }

        function t(key) {
            var dict = isEnglish() ? I18N.en : I18N.zh;
            return dict[key] || I18N.zh[key] || key;
        }

        function applyI18n() {
            document.title = t('page_title');
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
        }

        function localized(obj, defaultKey, englishKey, fallback) {
            if (!obj) {
                return fallback || '';
            }
            var value = isEnglish() ? obj[englishKey] : '';
            if (!value) {
                value = obj[defaultKey];
            }
            return value || fallback || '';
        }

        function serverMessage(message, fallbackKey) {
            if (!message) {
                return t(fallbackKey);
            }
            if (!isEnglish()) {
                return message;
            }
            var map = {
                '请求失败': 'Request failed',
                '记录加载失败': 'Failed to load records',
                '请先登录后查看投注记录': 'Please log in to view betting records'
            };
            return map[message] || t(fallbackKey);
        }

	    function api(service, params) {
	        var search = new URLSearchParams(params || {});
	        search.set('service', service);
            search.set('language', language_type || new URLSearchParams(location.search).get('language') || '');
	        return fetch(apiBase, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: search.toString(), credentials: 'same-origin' })
	            .then(function (res) { return res.text(); })
	            .then(function (text) {
	                var json = null;
	                try {
	                    json = JSON.parse(text);
	                } catch (e) {
	                    throw new Error(t('request_failed'));
	                }
	                var data = json.data || {};
	                if (String(data.code) !== '0') {
	                    throw new Error(serverMessage(data.msg, 'request_failed'));
	                }
	                var info = data.info || [];
	                return info[0] || null;
            });
    }

    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg || '';
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(function () { el.style.display = 'none'; }, 1800);
    }

	    function loadRecords(reset) {
	        if (!uid || !token) {
	            renderEmpty(t('login_required_records'));
	            return Promise.resolve();
	        }
        if (loading || finished && !reset) {
            return Promise.resolve();
        }
        if (reset) {
            page = 1;
            finished = false;
            orders = [];
            document.getElementById('list').innerHTML = '';
        }
        loading = true;
        document.getElementById('loadMore').disabled = true;
        return api('LotteryGame.orderList', {
            uid: uid,
            token: token,
            game_id: gameId || 0,
            game_code: gameCode || '',
            p: page
        }).then(function (result) {
            var list = (result && result.list) || [];
            orders = orders.concat(list);
            finished = list.length < 20;
            renderSummary(result || {});
            renderOrders(orders);
            page += 1;
	        }).catch(function (err) {
	            toast(serverMessage(err.message, 'records_load_failed'));
	            if (!orders.length) {
	                renderEmpty(serverMessage(err.message, 'records_load_failed'));
	            }
	        }).finally(function () {
            loading = false;
            var loadMore = document.getElementById('loadMore');
            loadMore.disabled = false;
            loadMore.style.display = (!finished && orders.length) ? 'block' : 'none';
        });
    }

    function renderSummary(result) {
	        var game = result.game || null;
	        var gameName = localized(game, 'game_name', 'game_name_en', '');
	        var isGameRecord = game && gameName;
	        document.getElementById('title').textContent = isGameRecord ? gameName + t('game_record_suffix') : t('betting_records');
	        document.getElementById('subtitle').textContent = isGameRecord ? t('current_game_only') : t('all_game_records');
	        document.getElementById('scope').textContent = isGameRecord ? (game.game_code || '') : t('all_lottery');
        document.getElementById('totalBet').textContent = money(result.total_bet);
        document.getElementById('totalPayout').textContent = money(result.total_payout);
        var profit = Number(result.profit_loss || 0);
        var profitEl = document.getElementById('profitLoss');
        profitEl.textContent = signedMoney(profit);
        profitEl.className = profit > 0 ? 'profit-win' : (profit < 0 ? 'profit-lose' : '');
    }

    function renderOrders(list) {
	        if (!list.length) {
	            renderEmpty(t('no_bet_records'));
	            return;
	        }
        document.getElementById('list').innerHTML = list.map(renderOrder).join('');
    }

    function renderOrder(order) {
        var profit = Number(order.profit_loss || order.net_amount || 0);
        var profitClass = profit > 0 ? 'profit-win' : (profit < 0 ? 'profit-lose' : '');
	        var items = (order.items || []).map(function (item) {
	            return '<div class="record-item">' +
	                escapeHtml(item.play_code || item.play_name || '') + ' · ' + escapeHtml(localized(item, 'option_name', 'option_name_en', item.option_code || '')) +
	                ' / ' + t('bet') + ' ' + money(item.bet_amount) +
	                ' / ' + t('odds') + ' ' + escapeHtml(item.odds || '--') +
	                ' / ' + t('payout') + ' ' + money(item.payout_amount) +
	                '</div>';
	        }).join('');
	        return '<article class="record">' +
	            '<div class="record-head"><span>' + escapeHtml(localized(order, 'game_name', 'game_name_en', order.game_code || t('lottery'))) + '</span><span class="record-status">' + escapeHtml(isEnglish() ? (order.status_text_en || order.status_text || '') : (order.status_text || '')) + '</span></div>' +
	            '<div class="record-meta"><span>' + t('issue') + ' ' + escapeHtml(order.issue_num || '--') + '</span><span>' + escapeHtml(order.bet_time_text || '') + '</span><span>' + escapeHtml(order.order_no || '') + '</span></div>' +
	            '<div class="record-stats">' +
	                '<div class="record-stat"><span>' + t('bet_amount') + '</span><strong>' + money(order.total_bet) + '</strong></div>' +
	                '<div class="record-stat"><span>' + t('payout') + '</span><strong>' + money(order.total_payout) + '</strong></div>' +
	                '<div class="record-stat"><span>' + t('profit_loss') + '</span><strong class="' + profitClass + '">' + signedMoney(profit) + '</strong></div>' +
            '</div>' +
            '<div class="record-items">' + items + '</div>' +
            '</article>';
    }

    function renderEmpty(text) {
        document.getElementById('list').innerHTML = '<div class="empty">' + escapeHtml(text) + '</div>';
        document.getElementById('loadMore').style.display = 'none';
    }

    function money(value) {
        var number = Number(value || 0);
        if (!isFinite(number)) {
            number = 0;
        }
        return number.toFixed(number % 1 === 0 ? 0 : 2);
    }

    function signedMoney(value) {
        var number = Number(value || 0);
        var prefix = number > 0 ? '+' : '';
        return prefix + money(number);
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (char) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char];
        });
    }

        applyI18n();
    if (overlayMode) {
        document.body.classList.add('overlay-mode');
    }
	    document.getElementById('refreshBtn').addEventListener('click', function () {
        loadRecords(true);
    });
    document.getElementById('loadMore').addEventListener('click', function () {
        loadRecords(false);
    });
    loadRecords(true);
</script>
</body>
</html>
