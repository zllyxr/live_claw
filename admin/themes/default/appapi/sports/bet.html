<!DOCTYPE html>
<html>
<head>
    <include file="appapi@head"/>
    <title>赛事下注</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --night: #071a13;
            --night-2: #0b2b1f;
            --card: rgba(255,255,255,.055);
            --card-line: rgba(255,255,255,.12);
            --lime: #c9ff43;
            --mint: #3ee08c;
            --fog: rgba(233,255,244,.72);
            --fog-2: rgba(233,255,244,.45);
        }
        html, body { height: 100%; }
        body {
            background:
                radial-gradient(120% 60% at 50% -8%, #14503a 0%, rgba(20,80,58,0) 60%),
                linear-gradient(180deg, #0a291d 0%, var(--night) 46%, #050f0b 100%);
            color: #f0fff7;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom)); }

        /* ---------- top bar ---------- */
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 12px; }
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--card-line);
            background: var(--card); color: #eafff4; cursor: pointer; backdrop-filter: blur(8px);
            -webkit-tap-highlight-color: transparent;
        }
        .page-title { font-size: 17px; font-weight: 800; letter-spacing: 2px; }
        .coin-chip {
            display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px;
            border-radius: 999px; border: 1px solid rgba(201,255,67,.4);
            background: rgba(201,255,67,.1); color: var(--lime); font-weight: 800; font-size: 14px;
            font-variant-numeric: tabular-nums;
        }
        .coin-chip svg { animation: coinFloat 2.6s ease-in-out infinite; }
        @keyframes coinFloat { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(12deg); } }

        /* ---------- VS 舞台 ---------- */
        .stage { position: relative; margin-top: 4px; }
        .stage-glow { position: absolute; left: 12%; right: 12%; top: -8px; height: 60px; background: radial-gradient(60% 100% at 50% 0, rgba(201,255,67,.18), transparent 70%); pointer-events: none; }
        .vs-board { position: relative; display: flex; align-items: stretch; min-height: 128px; }
        .plate {
            position: relative; flex: 1; min-width: 0; padding: 16px 12px 14px;
            display: flex; flex-direction: column; align-items: center; gap: 8px; justify-content: center;
            background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
            border: 1px solid var(--card-line);
        }
        .plate.home { clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); border-radius: 18px 0 0 18px; animation: fromLeft .5s ease both; }
        .plate.away { clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%); border-radius: 0 18px 18px 0; animation: fromRight .5s ease both; }
        @keyframes fromLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
        @keyframes fromRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
        .plate .logo {
            width: 52px; height: 52px; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 32% 30%, #fff, #cfe8db);
            color: #063b2a; font-weight: 900; font-size: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,.4);
            animation: float 3.4s ease-in-out infinite;
        }
        .plate.away .logo { animation-delay: -1.7s; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .plate .logo img { width: 36px; height: 36px; object-fit: contain; }
        .plate .name { max-width: 100%; font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vs-core { position: relative; flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .vs-word {
            font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: 1px;
            background: linear-gradient(120deg, var(--lime), var(--mint));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 4px 12px rgba(62,224,140,.5));
            animation: vsPulse 2.2s ease-in-out infinite;
        }
        @keyframes vsPulse { 0%,100% { transform: scale(1) skewX(-6deg); } 50% { transform: scale(1.12) skewX(-6deg); } }
        .vs-score { font-size: 13px; color: var(--fog); font-variant-numeric: tabular-nums; }
        .match-league { margin-top: 10px; text-align: center; font-size: 12px; color: var(--fog-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---------- 封盘倒计时环 + 状态 ---------- */
        .meta-strip { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
        .ring-box { position: relative; flex: 0 0 84px; height: 84px; }
        .ring-box svg { transform: rotate(-90deg); }
        .ring-track { stroke: rgba(255,255,255,.12); }
        .ring-bar { stroke: url(#ringG); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
        .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring-center b { font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
        .ring-center i { font-style: normal; font-size: 9px; color: var(--fog-2); margin-top: 2px; }
        .meta-main { flex: 1; min-width: 0; }
        .bet-state { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; }
        .bet-state.open { background: rgba(62,224,140,.14); color: var(--mint); border: 1px solid rgba(62,224,140,.4); }
        .bet-state.closed { background: rgba(255,120,120,.12); color: #ff9c9c; border: 1px solid rgba(255,120,120,.35); }
        .bet-state .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        .meta-tip { margin-top: 8px; font-size: 11px; color: var(--fog-2); line-height: 1.5; }

        /* ---------- 分区标题 ---------- */
        .zone-head { display: flex; align-items: center; gap: 10px; margin: 22px 2px 12px; }
        .zone-head .flag { width: 10px; height: 22px; border-radius: 4px; background: linear-gradient(180deg, var(--lime), var(--mint)); transform: skewX(-14deg); }
        .zone-head h3 { font-size: 16px; font-weight: 800; letter-spacing: 1px; }
        .zone-head .lines { flex: 1; height: 6px; background: repeating-linear-gradient(-60deg, rgba(255,255,255,.14) 0 5px, transparent 5px 13px); border-radius: 3px; }

        /* ---------- 主盘口(三选) 非对称大卡 ---------- */
        .hero-market { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
        .big-odd {
            position: relative; overflow: hidden; border-radius: 16px; padding: 14px 10px 12px;
            border: 1px solid var(--card-line); background: linear-gradient(165deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
            text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
            animation: rise .5s ease both;
        }
        .big-odd:nth-child(1) { transform-origin: bottom; padding-top: 20px; animation-delay: .05s; }
        .big-odd:nth-child(2) { margin-bottom: 14px; animation-delay: .12s; }
        .big-odd:nth-child(3) { padding-top: 20px; animation-delay: .19s; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        .big-odd:active { transform: scale(.95); }
        .big-odd .tag { font-size: 12px; color: var(--fog-2); font-weight: 600; }
        .big-odd .odd { margin-top: 8px; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; transition: color .2s ease; }
        .big-odd .glow { position: absolute; inset: auto -20% -55% -20%; height: 90px; background: radial-gradient(50% 100% at 50% 100%, rgba(201,255,67,.24), transparent 75%); opacity: 0; transition: opacity .25s ease; }
        .big-odd.on { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime), 0 10px 30px rgba(201,255,67,.18); }
        .big-odd.on .odd { color: var(--lime); }
        .big-odd.on .glow { opacity: 1; }
        .big-odd .tick { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--lime); display: none; align-items: center; justify-content: center; animation: tickPop .3s cubic-bezier(.2, 2, .4, 1) both; }
        @keyframes tickPop { from { transform: scale(0); } to { transform: scale(1); } }
        .big-odd.on .tick { display: flex; }

        /* ---------- 次级盘口 bento ---------- */
        .market-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .market-card {
            position: relative; overflow: hidden; border-radius: 16px; padding: 13px;
            border: 1px solid var(--card-line); background: var(--card);
            animation: rise .5s ease both;
        }
        .market-card.wide { grid-column: span 2; }
        .market-card h5 { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #eafff4; }
        .market-card h5 .mk { width: 6px; height: 14px; border-radius: 3px; background: var(--mint); transform: skewX(-14deg); }
        .market-card .rule { margin-top: 4px; font-size: 10px; color: var(--fog-2); }
        .opt-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        .market-card.wide .opt-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .opt {
            position: relative; border-radius: 12px; padding: 9px 6px; text-align: center;
            border: 1px solid var(--card-line); background: rgba(255,255,255,.05);
            cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all .18s ease;
        }
        .opt:active { transform: scale(.93); }
        .opt .n { display: block; font-size: 11px; color: var(--fog); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .opt .o { display: block; margin-top: 5px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .opt.on { border-color: var(--lime); background: rgba(201,255,67,.12); box-shadow: 0 0 14px rgba(201,255,67,.2); }
        .opt.on .o { color: var(--lime); }

        .lock-cover { position: relative; }
        .lock-cover .veil {
            position: absolute; inset: -4px; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            border-radius: 18px; background: rgba(5, 16, 11, .72); backdrop-filter: blur(3px);
            color: #ffd7d7; font-size: 14px; font-weight: 800; letter-spacing: 2px;
        }
        .lock-cover .veil svg { animation: shake 1.6s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-10deg); } 16% { transform: rotate(8deg); } 24% { transform: rotate(0); } }

        .empty-note { padding: 40px 10px; text-align: center; color: var(--fog-2); font-size: 13px; }

        /* ---------- 投注舱 dock ---------- */
        .dock {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            max-width: 560px; margin: 0 auto;
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
            background: rgba(7, 22, 15, .9); backdrop-filter: blur(16px);
            border-top: 1px solid rgba(201,255,67,.22);
            border-radius: 22px 22px 0 0;
            transition: transform .25s ease;
        }
        .dock-bar { display: flex; align-items: center; gap: 12px; }
        .picks-pill {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(255,255,255,.08); border: 1px solid var(--card-line); cursor: pointer;
        }
        .picks-pill .cnt {
            position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px;
            border-radius: 10px; background: var(--lime); color: #062d20; font-size: 11px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            animation: tickPop .3s cubic-bezier(.2, 2, .4, 1) both;
        }
        .dock-mid { flex: 1; min-width: 0; }
        .dock-mid .l1 { font-size: 12px; color: var(--fog-2); }
        .dock-mid .l2 { margin-top: 3px; font-size: 15px; font-weight: 800; color: var(--lime); font-variant-numeric: tabular-nums; }
        .go-bet {
            position: relative; overflow: hidden; border: 0; height: 48px; padding: 0 26px; border-radius: 24px;
            font-size: 16px; font-weight: 900; letter-spacing: 2px; color: #062d20; cursor: pointer;
            background: linear-gradient(120deg, var(--lime), var(--mint) 90%);
            box-shadow: 0 10px 26px rgba(62,224,140,.35);
            transition: transform .12s ease; -webkit-tap-highlight-color: transparent;
        }
        .go-bet:active { transform: scale(.95); }
        .go-bet[disabled] { filter: grayscale(.8); opacity: .55; }
        .go-bet .shine { position: absolute; top: 0; bottom: 0; width: 40px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.8), transparent); transform: skewX(-24deg); animation: shine 2.2s ease-in-out infinite; }
        @keyframes shine { 0% { left: -50px; } 60%, 100% { left: 130%; } }

        /* slip sheet */
        .sheet-mask { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
        .sheet-mask.show { opacity: 1; pointer-events: auto; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
            border-radius: 24px 24px 0 0; background: linear-gradient(180deg, #103626, #0a2418);
            border-top: 1px solid rgba(201,255,67,.3);
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            transform: translateY(105%); transition: transform .3s cubic-bezier(.3, 1, .4, 1);
            max-height: 76vh; display: flex; flex-direction: column;
        }
        .sheet.show { transform: translateY(0); }
        .sheet-grip { width: 40px; height: 4px; border-radius: 2px; margin: 0 auto 12px; background: rgba(255,255,255,.25); }
        .sheet h4 { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 800; }
        .sheet h4 .clear { font-size: 12px; color: var(--fog-2); font-weight: 600; cursor: pointer; }
        .picks { flex: 1; overflow-y: auto; margin-top: 10px; min-height: 40px; }
        .pick-row {
            display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,.12);
            animation: fromLeft .25s ease both;
        }
        .pick-info { flex: 1; min-width: 0; }
        .pick-info .m { font-size: 11px; color: var(--fog-2); }
        .pick-info .o { margin-top: 3px; font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pick-odds { flex: 0 0 auto; font-size: 15px; font-weight: 900; color: var(--lime); font-variant-numeric: tabular-nums; }
        .pick-del { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--card-line); background: transparent; color: var(--fog-2); font-size: 15px; cursor: pointer; }
        .amount-zone { margin-top: 12px; }
        .amount-zone .label { font-size: 12px; color: var(--fog-2); }
        .amount-line { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .amount-input {
            flex: 1; height: 46px; padding: 0 14px; border-radius: 14px;
            border: 1px solid rgba(201,255,67,.4); background: rgba(0,0,0,.3);
            color: var(--lime); font-size: 18px; font-weight: 900; outline: none; font-variant-numeric: tabular-nums;
        }
        .chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .chip {
            flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 800;
            border: 1px solid var(--card-line); background: rgba(255,255,255,.06); color: #eafff4;
            cursor: pointer; transition: all .15s ease; -webkit-tap-highlight-color: transparent;
        }
        .chip:active { transform: scale(.92); }
        .chip.on { background: rgba(201,255,67,.16); border-color: var(--lime); color: var(--lime); }
        .calc-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; color: var(--fog); }
        .calc-row b { color: var(--lime); font-size: 18px; font-variant-numeric: tabular-nums; }
        .confirm-btn {
            margin-top: 14px; width: 100%; height: 52px; border: 0; border-radius: 26px;
            position: relative; overflow: hidden;
            font-size: 17px; font-weight: 900; letter-spacing: 3px; color: #062d20; cursor: pointer;
            background: linear-gradient(120deg, var(--lime), var(--mint) 90%);
            box-shadow: 0 12px 30px rgba(62,224,140,.35);
            -webkit-tap-highlight-color: transparent;
        }
        .confirm-btn:active { transform: scale(.98); }
        .confirm-btn[disabled] { filter: grayscale(.8); opacity: .5; }
        .confirm-btn .shine { position: absolute; top: 0; bottom: 0; width: 46px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.8), transparent); transform: skewX(-24deg); animation: shine 2.4s ease-in-out infinite; }

        /* ---------- 成功覆层 ---------- */
        .win-mask { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(4, 14, 9, .88); backdrop-filter: blur(6px); }
        .win-mask.show { display: flex; }
        .win-card { position: relative; width: 82%; max-width: 340px; border-radius: 24px; padding: 30px 22px 24px; text-align: center; background: linear-gradient(165deg, #13402d, #0a2418); border: 1px solid rgba(201,255,67,.35); animation: winIn .45s cubic-bezier(.2, 1.4, .4, 1) both; }
        @keyframes winIn { from { opacity: 0; transform: scale(.7) translateY(30px); } to { opacity: 1; transform: none; } }
        .win-check { width: 84px; height: 84px; margin: 0 auto; }
        .win-check .cir { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 0.7s ease forwards; }
        .win-check .tk { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 0.4s ease .55s forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .win-title { margin-top: 12px; font-size: 20px; font-weight: 900; letter-spacing: 2px; }
        .win-sub { margin-top: 8px; font-size: 13px; color: var(--fog); line-height: 1.7; }
        .win-sub b { color: var(--lime); font-variant-numeric: tabular-nums; }
        .win-actions { display: flex; gap: 10px; margin-top: 20px; }
        .win-actions button { flex: 1; height: 44px; border-radius: 22px; font-size: 14px; font-weight: 800; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .w-ghost { background: transparent; border: 1px solid var(--card-line); color: #eafff4; }
        .w-main { background: linear-gradient(120deg, var(--lime), var(--mint)); border: 0; color: #062d20; }
        #confetti { position: absolute; inset: 0; pointer-events: none; }

        .toast {
            position: fixed; left: 50%; bottom: 130px; z-index: 70; transform: translateX(-50%) translateY(8px);
            padding: 10px 18px; border-radius: 999px; background: rgba(233, 255, 244, .95); color: #0a2418; font-size: 13px; font-weight: 700;
            opacity: 0; pointer-events: none; transition: all .25s ease; max-width: 82vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .skeleton { border-radius: 16px; border: 1px solid var(--card-line); background: linear-gradient(100deg, rgba(255,255,255,.04) 30%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.04) 70%); background-size: 220% 100%; animation: shimmer 1.2s ease-in-out infinite; height: 88px; margin-top: 10px; }
        @keyframes shimmer { 0% { background-position: 130% 0; } 100% { background-position: -90% 0; } }
    </style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="page">
    <div class="topbar">
        <button class="back-btn" id="btnBack">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="page-title">赛事下注</div>
        <div class="coin-chip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#c9ff43" stroke-width="2"/><path d="M12 7v10M9 9.6h4.6a1.9 1.9 0 1 1 0 3.8H9.8" stroke="#c9ff43" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="coin">--</span>
        </div>
    </div>

    <div class="stage">
        <div class="stage-glow"></div>
        <div class="vs-board">
            <div class="plate home">
                <div class="logo" id="homeLogo">主</div>
                <div class="name" id="homeName">主队</div>
            </div>
            <div class="vs-core">
                <div class="vs-word">VS</div>
                <div class="vs-score" id="scoreLine">- : -</div>
            </div>
            <div class="plate away">
                <div class="logo" id="awayLogo">客</div>
                <div class="name" id="awayName">客队</div>
            </div>
        </div>
        <div class="match-league" id="leagueLine">…</div>
    </div>

    <div class="meta-strip">
        <div class="ring-box">
            <svg width="84" height="84" viewBox="0 0 84 84">
                <defs>
                    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#c9ff43"/><stop offset="1" stop-color="#3ee08c"/>
                    </linearGradient>
                </defs>
                <circle class="ring-track" cx="42" cy="42" r="36" fill="none" stroke-width="7"/>
                <circle class="ring-bar" id="ringBar" cx="42" cy="42" r="36" fill="none" stroke-width="7" stroke-dasharray="226" stroke-dashoffset="226"/>
            </svg>
            <div class="ring-center"><b id="ringTime">--:--</b><i>封盘倒计时</i></div>
        </div>
        <div class="meta-main">
            <span class="bet-state" id="betState"><span class="dot"></span><span id="betStateText">加载中…</span></span>
            <div class="meta-tip">封盘前可自由组合注单 · 单场可多选 · 派彩以官方赛果为准</div>
        </div>
    </div>

    <div id="marketsWrap">
        <div class="skeleton"></div>
        <div class="skeleton" style="animation-delay:.15s"></div>
    </div>
</div>

<div class="dock" id="dock">
    <div class="dock-bar">
        <div class="picks-pill" id="picksPill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="#eafff4" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="cnt" id="pickCount" style="display:none">0</span>
        </div>
        <div class="dock-mid">
            <div class="l1" id="dockHint">点击赔率选择投注项</div>
            <div class="l2" id="dockTotal"></div>
        </div>
        <button class="go-bet" id="btnOpenSlip" disabled><span class="shine"></span>立即投注</button>
    </div>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <h4>我的注单 <span class="clear" id="btnClear">清空</span></h4>
    <div class="picks" id="picks"></div>
    <div class="amount-zone">
        <div class="label">单注金额（星币 / 每项）</div>
        <div class="amount-line">
            <input class="amount-input" id="amountInput" type="number" inputmode="numeric" min="1" placeholder="输入金额" value="10">
        </div>
        <div class="chips" id="chips"></div>
    </div>
    <div class="calc-row"><span>合计投入 <b id="calcTotal">0</b></span><span>预计最高派彩 <b id="calcPayout">0</b></span></div>
    <button class="confirm-btn" id="btnConfirm"><span class="shine"></span>确认投注</button>
</div>

<div class="win-mask" id="winMask">
    <div class="win-card">
        <canvas id="confetti"></canvas>
        <svg class="win-check" viewBox="0 0 100 100">
            <circle class="cir" cx="50" cy="50" r="41" fill="none" stroke="#3ee08c" stroke-width="5"/>
            <path class="tk" d="M32 51 45 64 70 38" fill="none" stroke="#c9ff43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="win-title">投注成功</div>
        <div class="win-sub" id="winInfo"></div>
        <div class="win-actions">
            <button class="w-ghost" id="btnToOrders">查看订单</button>
            <button class="w-main" id="btnAgain">继续投注</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
    var matchId = {$match_id_json|default='""'};
    var uid = {$uid_json|default='""'};
    var token = {$token_json|default='""'};
    var language = {$language_json|default='""'};
    var competitionType = {$competition_type_json|default='""'};

    var authFragment = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    uid = uid || authFragment.get('uid') || '';
    token = token || authFragment.get('token') || '';

    var apiBase = location.origin + '/core-api/appapi/';
    var state = {
        match: null,
        markets: [],
        open: false,
        enabled: false,
        statusText: '加载中…',
        countdown: 0,
        betCloseTs: 0,
        serverOffsetSeconds: 0,
        picks: {},
        amount: 10,
        submitting: false
    };
    var RING_LEN = 226;
    var CLOSE_WINDOW = 0;

    function el(id) { return document.getElementById(id); }
    function syncServerClock(info) {
        var serverTime = parseInt(info && info.server_time || '0', 10);
        if (serverTime > 0) {
            state.serverOffsetSeconds = serverTime - Math.floor(Date.now() / 1000);
        }
    }
    function serverNow() {
        return Math.floor(Date.now() / 1000) + state.serverOffsetSeconds;
    }
    function fmtOdds(value) {
        var num = parseFloat(value);
        if (isNaN(num)) { return String(value == null ? '' : value); }
        return String(parseFloat(num.toFixed(2)));
    }

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }
    function toast(message) {
        var node = el('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(node._t);
        node._t = setTimeout(function () { node.classList.remove('show'); }, 2200);
    }
    function api(service, params) {
        var search = new URLSearchParams(params || {});
        search.set('service', service);
        if (language) { search.set('language', language); }
        if (uid) { search.set('uid', uid); }
        if (token) { search.set('token', token); }
        return fetch(apiBase, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: search.toString(), credentials: 'same-origin' })
            .then(function (res) { return res.json(); })
            .then(function (json) {
                var data = json.data || {};
                if (String(data.code) !== '0') { throw new Error(data.msg || '请求失败'); }
                return (data.info || [])[0] || null;
            });
    }

    /* ---------- 背景粒子 ---------- */
    (function particles() {
        var canvas = el('fx');
        var ctx = canvas.getContext('2d');
        var dots = [];
        function resize() {
            canvas.width = innerWidth * devicePixelRatio;
            canvas.height = innerHeight * devicePixelRatio;
        }
        resize();
        addEventListener('resize', resize);
        for (var i = 0; i < 42; i++) {
            dots.push({
                x: Math.random(), y: Math.random(),
                r: (Math.random() * 1.6 + 0.6) * devicePixelRatio,
                s: Math.random() * 0.00035 + 0.0001,
                a: Math.random() * 0.5 + 0.15,
                lime: Math.random() < 0.28
            });
        }
        (function tick() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(function (d) {
                d.y -= d.s;
                if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
                ctx.beginPath();
                ctx.arc(d.x * canvas.width, d.y * canvas.height, d.r, 0, Math.PI * 2);
                ctx.fillStyle = d.lime ? 'rgba(201,255,67,' + d.a + ')' : 'rgba(233,255,244,' + d.a * 0.75 + ')';
                ctx.fill();
            });
            requestAnimationFrame(tick);
        })();
    })();

    /* ---------- 渲染 ---------- */
    function setLogo(id, url, fallback) {
        var box = el(id);
        if (url) {
            box.innerHTML = '';
            var img = document.createElement('img');
            img.src = url;
            img.onerror = function () { box.textContent = fallback; };
            box.appendChild(img);
        } else {
            box.textContent = fallback;
        }
    }

    function renderMatch(m) {
        if (!m) { return; }
        state.match = m;
        el('homeName').textContent = m.home_name || '主队';
        el('awayName').textContent = m.away_name || '客队';
        setLogo('homeLogo', m.home_logo, String(m.home_name || '主').slice(0, 1));
        setLogo('awayLogo', m.away_logo, String(m.away_name || '客').slice(0, 1));
        el('scoreLine').textContent = (m.home_score == null ? '-' : m.home_score) + ' : ' + (m.away_score == null ? '-' : m.away_score);
        el('leagueLine').textContent = (m.competition_type || competitionType || '足球赛事') + ' · ' + (m.kickoff_text || '');
    }

    function renderState(enabled, message, open) {
        if (typeof open === 'boolean') { state.open = open; }
        state.enabled = enabled;
        state.statusText = message || (enabled ? '盘口开放中' : '当前不可投注');
        var box = el('betState');
        box.className = 'bet-state ' + (enabled ? 'open' : 'closed');
        el('betStateText').textContent = state.statusText;
        syncDock();
    }

    function optionButton(market, option, hero) {
        var key = String(option.id);
        var picked = !!state.picks[key];
        if (hero) {
            return '<div class="big-odd' + (picked ? ' on' : '') + '" data-oid="' + esc(key) + '">' +
                '<span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17.5 19 7.5" stroke="#062d20" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
                '<div class="tag">' + esc(option.option_name) + '</div>' +
                '<div class="odd">' + esc(fmtOdds(option.odds)) + '</div>' +
                '<div class="glow"></div></div>';
        }
        return '<div class="opt' + (picked ? ' on' : '') + '" data-oid="' + esc(key) + '">' +
            '<span class="n">' + esc(option.option_name) + '</span>' +
            '<span class="o">' + esc(fmtOdds(option.odds)) + '</span></div>';
    }

    function renderMarkets() {
        var wrap = el('marketsWrap');
        var markets = state.markets;
        if (!markets.length) {
            wrap.innerHTML = '<div class="empty-note">盘口暂未开放，稍后再来看看</div>';
            return;
        }
        var html = '';
        var first = markets[0];
        var heroFirst = first && (first.options || []).length === 3;
        if (heroFirst) {
            html += '<div class="zone-head"><span class="flag"></span><h3>' + esc(first.market_name || '胜平负') + '</h3><span class="lines"></span></div>';
            html += '<div class="hero-market" data-mid="' + esc(first.id) + '">';
            (first.options || []).forEach(function (option) { html += optionButton(first, option, true); });
            html += '</div>';
        }
        var rest = heroFirst ? markets.slice(1) : markets;
        if (rest.length) {
            html += '<div class="zone-head"><span class="flag"></span><h3>更多玩法</h3><span class="lines"></span></div>';
            html += '<div class="market-grid">';
            rest.forEach(function (market, index) {
                var count = (market.options || []).length;
                var wide = count >= 4 || (index % 3 === 2);
                html += '<div class="market-card' + (wide ? ' wide' : '') + '" style="animation-delay:' + (index * 60) + 'ms" data-mid="' + esc(market.id) + '">' +
                    '<h5><span class="mk"></span>' + esc(market.market_name || market.market_code) + '</h5>' +
                    (market.market_rule ? '<div class="rule">' + esc(market.market_rule) + '</div>' : '') +
                    '<div class="opt-row">';
                (market.options || []).forEach(function (option) { html += optionButton(market, option, false); });
                html += '</div></div>';
            });
            html += '</div>';
        }
        if (!state.enabled) {
            html = '<div class="lock-cover">' + html +
                '<div class="veil"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.4" stroke="#ffd7d7" stroke-width="2"/><path d="M8 10V7.6A4 4 0 0 1 16 7.6V10" stroke="#ffd7d7" stroke-width="2"/></svg>' + esc(el('betStateText').textContent || '已封盘') + '</div></div>';
        }
        wrap.innerHTML = html;
    }

    function findOption(optionId) {
        for (var i = 0; i < state.markets.length; i++) {
            var market = state.markets[i];
            var options = market.options || [];
            for (var j = 0; j < options.length; j++) {
                if (String(options[j].id) === String(optionId)) {
                    return { market: market, option: options[j] };
                }
            }
        }
        return null;
    }

    document.addEventListener('click', function (event) {
        var target = event.target.closest('[data-oid]');
        if (!target) { return; }
        if (!state.enabled) { toast(state.statusText || '当前不可投注'); return; }
        var oid = target.getAttribute('data-oid');
        if (state.picks[oid]) {
            delete state.picks[oid];
        } else {
            var found = findOption(oid);
            if (!found) { return; }
            state.picks[oid] = { market_name: found.market.market_name, option_name: found.option.option_name, odds: found.option.odds };
        }
        target.classList.toggle('on');
        syncDock();
    });

    /* ---------- dock / slip ---------- */
    function pickIds() { return Object.keys(state.picks); }

    function syncDock() {
        var count = pickIds().length;
        var pill = el('pickCount');
        pill.style.display = count ? '' : 'none';
        pill.textContent = count;
        el('btnOpenSlip').disabled = !count || !state.enabled;
        if (!count) {
            el('dockHint').textContent = state.enabled ? '点击赔率选择投注项' : (state.statusText || '当前不可投注');
            el('dockTotal').textContent = '';
        } else {
            el('dockHint').textContent = '已选 ' + count + ' 项';
            el('dockTotal').textContent = '合计 ' + (count * state.amount) + ' 星币';
        }
        renderCalc();
    }

    function renderSlip() {
        var box = el('picks');
        var ids = pickIds();
        if (!ids.length) {
            box.innerHTML = '<div class="empty-note" style="padding:18px">还没有选择投注项</div>';
            return;
        }
        var html = '';
        ids.forEach(function (oid, index) {
            var pick = state.picks[oid];
            html += '<div class="pick-row" style="animation-delay:' + (index * 40) + 'ms">' +
                '<div class="pick-info"><div class="m">' + esc(pick.market_name) + '</div><div class="o">' + esc(pick.option_name) + '</div></div>' +
                '<div class="pick-odds">@' + esc(fmtOdds(pick.odds)) + '</div>' +
                '<button class="pick-del" data-del="' + esc(oid) + '">×</button></div>';
        });
        box.innerHTML = html;
    }

    el('picks').addEventListener('click', function (event) {
        var target = event.target.closest('[data-del]');
        if (!target) { return; }
        var oid = target.getAttribute('data-del');
        delete state.picks[oid];
        var node = document.querySelector('[data-oid="' + oid + '"]');
        if (node) { node.classList.remove('on'); }
        renderSlip();
        syncDock();
    });

    function renderCalc() {
        var ids = pickIds();
        var total = ids.length * state.amount;
        var payout = 0;
        ids.forEach(function (oid) {
            payout += Math.floor(state.amount * parseFloat(state.picks[oid].odds || '0'));
        });
        el('calcTotal').textContent = total;
        el('calcPayout').textContent = payout;
    }

    var QUICK = [10, 50, 100, 500, 1000, 5000];
    (function initChips() {
        var html = '';
        QUICK.forEach(function (value) {
            html += '<span class="chip' + (value === state.amount ? ' on' : '') + '" data-amt="' + value + '">' + value + '</span>';
        });
        el('chips').innerHTML = html;
    })();
    el('chips').addEventListener('click', function (event) {
        var target = event.target.closest('[data-amt]');
        if (!target) { return; }
        state.amount = parseInt(target.getAttribute('data-amt'), 10);
        el('amountInput').value = state.amount;
        document.querySelectorAll('.chip').forEach(function (chip) { chip.classList.toggle('on', chip === target); });
        renderCalc();
        syncDock();
    });
    el('amountInput').addEventListener('input', function () {
        var value = parseInt(this.value, 10);
        state.amount = isNaN(value) || value < 1 ? 0 : value;
        document.querySelectorAll('.chip').forEach(function (chip) { chip.classList.toggle('on', parseInt(chip.getAttribute('data-amt'), 10) === state.amount); });
        renderCalc();
        syncDock();
    });

    function openSlip() {
        renderSlip();
        renderCalc();
        el('sheet').classList.add('show');
        el('sheetMask').classList.add('show');
    }
    function closeSlip() {
        el('sheet').classList.remove('show');
        el('sheetMask').classList.remove('show');
    }
    el('btnOpenSlip').addEventListener('click', openSlip);
    el('picksPill').addEventListener('click', function () { if (pickIds().length) { openSlip(); } });
    el('sheetMask').addEventListener('click', closeSlip);
    el('btnClear').addEventListener('click', function () {
        state.picks = {};
        document.querySelectorAll('.on[data-oid]').forEach(function (node) { node.classList.remove('on'); });
        renderSlip();
        syncDock();
    });

    /* ---------- 提交 ---------- */
    el('btnConfirm').addEventListener('click', function () {
        if (state.submitting) { return; }
        var ids = pickIds();
        if (!ids.length) { toast('请先选择投注项'); return; }
        if (!state.amount || state.amount < 1) { toast('请输入有效金额'); return; }
        if (!uid || !token) { toast('请先登录'); return; }
        var items = ids.map(function (oid) { return { option_id: parseInt(oid, 10), amount: state.amount }; });
        state.submitting = true;
        el('btnConfirm').disabled = true;
        api('SportsBet.bet', {
            match_id: matchId,
            client_trace_id: 'h5-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
            items: JSON.stringify(items)
        }).then(function (order) {
            closeSlip();
            showSuccess(order);
            state.picks = {};
            document.querySelectorAll('.on[data-oid]').forEach(function (node) { node.classList.remove('on'); });
            syncDock();
            return loadMarkets();
        }).catch(function (err) {
            toast(err.message || '投注失败');
        }).then(function () {
            state.submitting = false;
            el('btnConfirm').disabled = false;
        });
    });

    function showSuccess(order) {
        var total = order && order.total_bet ? order.total_bet : el('calcTotal').textContent;
        var payout = el('calcPayout').textContent;
        el('winInfo').innerHTML = '订单号 ' + esc(order && order.order_no || '—') + '<br>投入 <b>' + esc(total) + '</b> 星币 · 预计最高派彩 <b>' + esc(payout) + '</b> 星币';
        el('winMask').classList.add('show');
        burstConfetti();
    }

    function burstConfetti() {
        var canvas = el('confetti');
        var card = canvas.parentElement;
        canvas.width = card.clientWidth * devicePixelRatio;
        canvas.height = card.clientHeight * devicePixelRatio;
        var ctx = canvas.getContext('2d');
        var parts = [];
        var colors = ['#c9ff43', '#3ee08c', '#ffffff', '#ffd764', '#7fe8ff'];
        for (var i = 0; i < 90; i++) {
            parts.push({
                x: canvas.width / 2, y: canvas.height * 0.32,
                vx: (Math.random() - 0.5) * 9 * devicePixelRatio,
                vy: (Math.random() * -7 - 2) * devicePixelRatio,
                w: (Math.random() * 5 + 3) * devicePixelRatio,
                h: (Math.random() * 3 + 2) * devicePixelRatio,
                c: colors[Math.floor(Math.random() * colors.length)],
                r: Math.random() * Math.PI,
                vr: (Math.random() - 0.5) * 0.3,
                life: 90 + Math.random() * 40
            });
        }
        var frame = 0;
        (function tick() {
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var alive = false;
            parts.forEach(function (p) {
                if (frame > p.life) { return; }
                alive = true;
                p.x += p.vx; p.y += p.vy; p.vy += 0.22 * devicePixelRatio; p.r += p.vr;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.r);
                ctx.fillStyle = p.c;
                ctx.globalAlpha = Math.max(0, 1 - frame / p.life);
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });
            if (alive) { requestAnimationFrame(tick); }
        })();
    }

    el('btnAgain').addEventListener('click', function () { el('winMask').classList.remove('show'); });
    el('btnToOrders').addEventListener('click', function () { goto('orders'); });

    /* ---------- 倒计时环 ---------- */
    function tickRing() {
        if (state.betCloseTs < 1) { return; }
        state.countdown = Math.max(0, state.betCloseTs - serverNow());
        var seconds = state.countdown;
        var m = Math.floor(seconds / 60), s = seconds % 60;
        var h = Math.floor(m / 60);
        m = m % 60;
        var label = seconds <= 0 ? '已封盘' : (h > 0 ? h + ':' + two(m) + ':' + two(s) : two(m) + ':' + two(s));
        el('ringTime').textContent = label;
        var ratio = CLOSE_WINDOW > 0 ? Math.max(0, Math.min(1, seconds / CLOSE_WINDOW)) : 0;
        el('ringBar').style.strokeDashoffset = String(RING_LEN * (1 - ratio));
        if (seconds <= 0 && state.open) {
            renderState(false, '已封盘', false);
            renderMarkets();
        }
    }
    function two(n) { return (n < 10 ? '0' : '') + n; }

    /* ---------- 数据 ---------- */
    function loadMarkets() {
        return api('SportsBet.matchMarkets', { match_id: matchId }).then(function (info) {
            if (!info) { return; }
            syncServerClock(info);
            renderMatch(info.match);
            state.markets = info.markets || [];
            state.betCloseTs = parseInt(info.bet_close_ts || info.match && info.match.bet_close_ts || '0', 10);
            state.countdown = state.betCloseTs > 0 ? Math.max(0, state.betCloseTs - serverNow()) : parseInt(info.close_countdown || '0', 10);
            if (state.countdown > CLOSE_WINDOW) { CLOSE_WINDOW = Math.max(state.countdown, 600); }
            if (!CLOSE_WINDOW) { CLOSE_WINDOW = 600; }
            el('coin').textContent = info.coin || '0';
            renderState(String(info.bet_enabled) === '1', info.bet_status_text, String(info.bet_open) === '1');
            renderMarkets();
            tickRing();
        }).catch(function (err) {
            el('marketsWrap').innerHTML = '<div class="empty-note">' + esc(err.message || '加载失败') + '</div>';
        });
    }

    function goto(page) {
        var params = new URLSearchParams();
        params.set('match_id', matchId);
        if (language) { params.set('language', language); }
        if (competitionType) { params.set('competition_type', competitionType); }
        var frag = new URLSearchParams();
        if (uid) { frag.set('uid', uid); }
        if (token) { frag.set('token', token); }
        var url = location.origin + '/appapi/sports/' + page + '?' + params.toString();
        var hash = frag.toString();
        location.href = hash ? url + '#' + hash : url;
    }

    el('btnBack').addEventListener('click', function () {
        if (history.length > 1) { history.back(); } else { goto('detail'); }
    });

    loadMarkets();
    setInterval(loadMarkets, 20000);
    setInterval(tickRing, 1000);
})();
</script>
</body>
