<!DOCTYPE html>
<html>
<head>
    <include file="appapi@head"/>
    <title>订单详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green-deep: #063b2c;
            --green: #0b7a52;
            --green-bright: #12a06b;
            --lime: #c9ff43;
            --gold: #d9a520;
            --ink: #10241d;
            --ink-2: #5f6f68;
            --ink-3: #93a29b;
            --bg: #eef4f1;
            --surface: #ffffff;
            --line: #e2ebe6;
        }
        body {
            background: var(--bg); color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }

        .topbar { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; }
        .back-btn {
            display: flex; align-items: center; justify-content: center; flex: 0 0 38px;
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
            background: #fff; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .top-main { flex: 1; min-width: 0; }
        .top-title { font-size: 17px; font-weight: 800; }
        .top-sub { margin-top: 3px; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 总览 非对称三格 */
        .summary { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 10px; }
        .sum-card {
            position: relative; overflow: hidden; border-radius: 16px; padding: 14px;
            background: var(--surface); box-shadow: 0 6px 20px rgba(14,45,35,.06);
            animation: rise .5s ease both;
        }
        .sum-card:nth-child(2) { animation-delay: .07s; }
        .sum-card:nth-child(3) { animation-delay: .14s; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .sum-card h5 { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: 1px; }
        .sum-card b { display: block; margin-top: 7px; font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .sum-card.main { color: #fff; background: linear-gradient(140deg, #0b6a47, #12a06b); box-shadow: 0 12px 26px rgba(10,106,72,.3); }
        .sum-card.main h5 { color: rgba(233,255,244,.75); }
        .sum-card .up { color: var(--green-bright); }
        .sum-card .down { color: #d96262; }
        .sum-card .spark { position: absolute; right: -14px; bottom: -18px; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 34% 34%, rgba(201,255,67,.4), transparent 70%); }

        .speed { display: flex; align-items: center; gap: 8px; margin: 18px 2px 12px; }
        .speed .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green-bright), rgba(18,160,107,0)); flex: 1; transform: skewX(-24deg); }
        .speed .bar.b2 { flex: 0 0 34px; opacity: .55; }
        .speed .bar.b3 { flex: 0 0 16px; opacity: .3; }
        .speed-label { font-size: 15px; font-weight: 800; white-space: nowrap; }
        .speed-count { font-size: 12px; color: var(--ink-3); }

        /* 订单卡 */
        .order {
            position: relative; overflow: hidden; border-radius: 18px; margin-bottom: 12px; padding: 14px 14px 12px;
            background: var(--surface); box-shadow: 0 6px 20px rgba(14,45,35,.06);
            animation: rise .45s ease both;
        }
        .order .ribbon {
            position: absolute; top: 12px; right: -34px; width: 120px; padding: 5px 0;
            text-align: center; font-size: 11px; font-weight: 900; letter-spacing: 2px;
            transform: rotate(38deg); color: #fff; background: #9db3aa;
        }
        .order.win .ribbon { background: linear-gradient(120deg, #f3c62d, #d9a520); }
        .order.lose .ribbon { background: #b8c4be; }
        .order.pending .ribbon { background: linear-gradient(120deg, #12a06b, #3ee08c); animation: breathe 2s ease-in-out infinite; }
        .order.refund .ribbon { background: #7fa5c9; }
        @keyframes breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.22); } }
        .order-head { display: flex; align-items: center; gap: 8px; padding-right: 56px; }
        .order-no { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .order-title { margin-top: 6px; font-size: 15px; font-weight: 800; padding-right: 40px; }
        .order-time { margin-top: 4px; font-size: 11px; color: var(--ink-3); }
        .items { margin-top: 10px; border-top: 1px dashed var(--line); }
        .item-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
        .item-ico { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #eef7f2; }
        .item-main { flex: 1; min-width: 0; }
        .item-main .m { font-size: 11px; color: var(--ink-3); }
        .item-main .o { margin-top: 2px; font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-num { flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
        .item-num b { display: block; font-size: 13px; }
        .item-num .win-t { color: var(--gold); }
        .item-num .lose-t { color: #9db3aa; }
        .order-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
        .order-foot b { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .order-foot .profit-up { color: var(--gold); }
        .order-foot .profit-down { color: #9db3aa; }
        .remark { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: #f4f8f5; font-size: 11px; color: var(--ink-2); }

        .load-more {
            display: block; margin: 16px auto 0; padding: 10px 30px; border-radius: 999px;
            border: 2px solid #cfe6db; background: #fff; color: var(--green); font-size: 14px; font-weight: 800; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 空态 */
        .empty { padding: 44px 20px 30px; text-align: center; animation: rise .5s ease both; }
        .empty svg { display: block; margin: 0 auto; }
        .empty .roll { transform-origin: 60px 60px; animation: spin 5s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty h4 { margin-top: 16px; font-size: 16px; font-weight: 800; color: var(--ink-2); }
        .empty p { margin-top: 8px; font-size: 12px; color: var(--ink-3); line-height: 1.6; }

        /* 底部按钮 */
        .action-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; gap: 12px; max-width: 560px; margin: 0 auto;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            background: rgba(255,255,255,.86); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
        }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; border: 0;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: transform .12s ease; -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.96); }
        .btn-detail { flex: 1; color: var(--green); background: #fff; border: 2px solid #cfe6db; }
        .btn-bet { flex: 1.7; position: relative; overflow: hidden; color: #062d20; background: linear-gradient(120deg, #c9ff43, #3ee08c 90%); box-shadow: 0 10px 26px rgba(38,197,123,.4); }
        .btn-bet .shine { position: absolute; top: 0; bottom: 0; width: 46px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-24deg); animation: shine 2.4s ease-in-out infinite; }
        @keyframes shine { 0% { left: -60px; } 55%, 100% { left: 120%; } }

        .toast {
            position: fixed; left: 50%; bottom: 118px; z-index: 40; transform: translateX(-50%) translateY(8px);
            padding: 10px 18px; border-radius: 999px; background: rgba(9,30,22,.92); color: #eafff4; font-size: 13px;
            opacity: 0; pointer-events: none; transition: all .25s ease;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .skeleton { border-radius: 18px; height: 120px; margin-bottom: 12px; background: linear-gradient(100deg, #e7efe9 30%, #f6faf7 50%, #e7efe9 70%); background-size: 220% 100%; animation: shimmer 1.2s ease-in-out infinite; }
        @keyframes shimmer { 0% { background-position: 130% 0; } 100% { background-position: -90% 0; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <button class="back-btn" id="btnBack">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="top-main">
            <div class="top-title">订单详情</div>
            <div class="top-sub" id="matchLine">本场比赛的全部注单</div>
        </div>
    </div>

    <div class="summary">
        <div class="sum-card main"><div class="spark"></div><h5>总投入（星币）</h5><b id="sumBet">0</b></div>
        <div class="sum-card"><h5>总派彩</h5><b id="sumPayout">0</b></div>
        <div class="sum-card"><h5>盈亏</h5><b id="sumNet">0</b></div>
    </div>

    <div class="speed">
        <span class="speed-label">注单记录</span>
        <span class="speed-count" id="countNote"></span>
        <span class="bar"></span><span class="bar b2"></span><span class="bar b3"></span>
    </div>

    <div id="listWrap">
        <div class="skeleton"></div>
        <div class="skeleton" style="animation-delay:.15s"></div>
    </div>
</div>

<div class="action-bar">
    <button class="btn btn-detail" id="btnDetail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16.2v.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        返回详情
    </button>
    <button class="btn btn-bet" id="btnBet">
        <span class="shine"></span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8.4 15 10.6 13.9 14.1 10.1 14.1 9 10.6Z" fill="currentColor"/></svg>
        继续下注
    </button>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
    var matchId = {$match_id_json|default='""'};
    var uid = {$uid_json|default='""'};
    var token = {$token_json|default='""'};
    var language = {$language_json|default='""'};
    var competitionType = {$competition_type_json|default='""'};

    var authFragment = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    uid = uid || authFragment.get('uid') || '';
    token = token || authFragment.get('token') || '';

    var apiBase = location.origin + '/core-api/appapi/';
    var page = 1;
    var loading = false;

    function el(id) { return document.getElementById(id); }
    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }
    function toast(message) {
        var node = el('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(node._t);
        node._t = setTimeout(function () { node.classList.remove('show'); }, 2200);
    }
    function api(service, params) {
        var search = new URLSearchParams(params || {});
        search.set('service', service);
        if (language) { search.set('language', language); }
        if (uid) { search.set('uid', uid); }
        if (token) { search.set('token', token); }
        return fetch(apiBase, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: search.toString(), credentials: 'same-origin' })
            .then(function (res) { return res.json(); })
            .then(function (json) {
                var data = json.data || {};
                if (String(data.code) !== '0') { throw new Error(data.msg || '请求失败'); }
                return (data.info || [])[0] || null;
            });
    }

    function countTo(id, target) {
        var node = el(id);
        var value = parseInt(target, 10) || 0;
        var start = 0;
        var steps = 24;
        var step = 0;
        clearInterval(node._t);
        node._t = setInterval(function () {
            step++;
            var eased = 1 - Math.pow(1 - step / steps, 3);
            node.textContent = Math.round(start + (value - start) * eased);
            if (step >= steps) { clearInterval(node._t); node.textContent = value; }
        }, 26);
    }

    function two(n) { return (n < 10 ? '0' : '') + n; }
    function fmtOdds(value) {
        var num = parseFloat(value);
        if (isNaN(num)) { return String(value == null ? '' : value); }
        return String(parseFloat(num.toFixed(2)));
    }

    function fmtTime(ts, serverText) {
        if (serverText) { return String(serverText); }
        var t = parseInt(ts, 10);
        if (!t) { return ''; }
        var parts = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).formatToParts(new Date(t * 1000));
        var map = {};
        parts.forEach(function (part) { map[part.type] = part.value; });
        return map.month + '-' + map.day + ' ' + map.hour + ':' + map.minute;
    }

    function orderClass(status) {
        if (status === '1') { return 'win'; }
        if (status === '2') { return 'lose'; }
        if (status === '3') { return 'refund'; }
        if (status === '4') { return 'lose'; }
        return 'pending';
    }

    function itemIcon(winStatus) {
        if (winStatus === '1') {
            return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17.5 19 7.5" stroke="#d9a520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
        if (winStatus === '2') {
            return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="#9db3aa" stroke-width="3" stroke-linecap="round"/></svg>';
        }
        return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#12a06b" stroke-width="2.4"/><path d="M12 8v4l2.6 2.6" stroke="#12a06b" stroke-width="2.2" stroke-linecap="round"/></svg>';
    }

    function renderOrder(order, index) {
        var cls = orderClass(String(order.status));
        var html = '<div class="order ' + cls + '" style="animation-delay:' + (index * 60) + 'ms">' +
            '<div class="ribbon">' + esc(order.status_text || '待结算') + '</div>' +
            '<div class="order-head"><span class="order-no">单号 ' + esc(order.order_no) + '</span></div>' +
            '<div class="order-title">' + esc(order.match_title || '足球赛事') + '</div>' +
            '<div class="order-time">投注时间 ' + esc(fmtTime(order.bet_time, order.bet_time_text)) + (String(order.settle_time) !== '0' ? ' · 结算 ' + esc(fmtTime(order.settle_time, order.settle_time_text)) : '') + '</div>';
        html += '<div class="items">';
        (order.items || []).forEach(function (item) {
            var winStatus = String(item.win_status);
            var payoutText = winStatus === '1' ? '<b class="win-t">+' + esc(item.payout_amount) + '</b>' : (winStatus === '2' ? '<b class="lose-t">+0</b>' : '<b>待定</b>');
            html += '<div class="item-row">' +
                '<span class="item-ico">' + itemIcon(winStatus) + '</span>' +
                '<span class="item-main"><span class="m">' + esc(item.market_name) + '</span><span class="o">' + esc(item.option_name) + ' @' + esc(fmtOdds(item.odds)) + '</span></span>' +
                '<span class="item-num">投 ' + esc(item.bet_amount) + payoutText + '</span></div>';
        });
        html += '</div>';
        var net = parseInt(order.net_amount, 10) || 0;
        html += '<div class="order-foot"><span>投入 <b>' + esc(order.total_bet) + '</b></span><span>派彩 <b>' + esc(order.total_payout) + '</b></span>' +
            '<span>盈亏 <b class="' + (net >= 0 ? 'profit-up' : 'profit-down') + '">' + (net > 0 ? '+' : '') + net + '</b></span></div>';
        if (order.settle_remark) {
            html += '<div class="remark">' + esc(order.settle_remark) + '</div>';
        }
        html += '</div>';
        return html;
    }

    function emptyBlock() {
        return '<div class="empty">' +
            '<svg width="120" height="120" viewBox="0 0 120 120" fill="none">' +
            '<ellipse cx="60" cy="102" rx="34" ry="6" fill="#dceae2"/>' +
            '<g class="roll"><circle cx="60" cy="60" r="30" fill="#fff" stroke="#cfe6db" stroke-width="3"/>' +
            '<path d="M60 44 71 52 67 65 53 65 49 52Z" fill="#12a06b"/>' +
            '<path d="M60 44V32M71 52l12-4M67 65l7 11M53 65l-7 11M49 52l-12-4" stroke="#cfe6db" stroke-width="2.6"/></g>' +
            '</svg>' +
            '<h4>本场还没有注单</h4><p>去挑一个心仪的赔率<br>开启第一注吧</p></div>';
    }

    function load(append) {
        if (loading) { return; }
        loading = true;
        api('SportsBet.orderList', { match_id: matchId, p: page }).then(function (info) {
            if (!info) { return; }
            var list = info.list || [];
            countTo('sumBet', info.total_bet);
            countTo('sumPayout', info.total_payout);
            var netNode = el('sumNet');
            var net = parseInt(info.profit_loss, 10) || 0;
            countTo('sumNet', Math.abs(net));
            netNode.className = net >= 0 ? 'up' : 'down';
            setTimeout(function () { netNode.textContent = (net > 0 ? '+' : (net < 0 ? '-' : '')) + Math.abs(net); }, 700);
            el('countNote').textContent = '共 ' + (info.total_count || 0) + ' 单';
            if (info.match) {
                el('matchLine').textContent = (info.match.home_name || '') + ' vs ' + (info.match.away_name || '') + ' · ' + (info.match.kickoff_text || '');
            }

            var wrap = el('listWrap');
            var html = '';
            list.forEach(function (order, index) { html += renderOrder(order, index); });
            if (!append) {
                wrap.innerHTML = html || emptyBlock();
            } else {
                var btn = el('btnMore');
                if (btn) { btn.remove(); }
                wrap.insertAdjacentHTML('beforeend', html);
            }
            if (list.length >= 20) {
                wrap.insertAdjacentHTML('beforeend', '<button class="load-more" id="btnMore">加载更多</button>');
                el('btnMore').addEventListener('click', function () { page++; load(true); });
            }
        }).catch(function (err) {
            el('listWrap').innerHTML = '<div class="empty"><h4>' + esc(err.message || '加载失败') + '</h4></div>';
        }).then(function () { loading = false; });
    }

    function goto(pageName) {
        var params = new URLSearchParams();
        params.set('match_id', matchId);
        if (language) { params.set('language', language); }
        if (competitionType) { params.set('competition_type', competitionType); }
        var frag = new URLSearchParams();
        if (uid) { frag.set('uid', uid); }
        if (token) { frag.set('token', token); }
        var url = location.origin + '/appapi/sports/' + pageName + '?' + params.toString();
        var hash = frag.toString();
        location.href = hash ? url + '#' + hash : url;
    }

    el('btnBack').addEventListener('click', function () {
        if (history.length > 1) { history.back(); } else { goto('detail'); }
    });
    el('btnDetail').addEventListener('click', function () { goto('detail'); });
    el('btnBet').addEventListener('click', function () { goto('bet'); });

    if (!uid || !token) {
        el('listWrap').innerHTML = '<div class="empty"><h4>请先登录</h4><p>登录后查看本场注单</p></div>';
    } else {
        load(false);
    }
})();
</script>
</body>
</html>
