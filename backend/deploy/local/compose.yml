name: claw-v2-local

services:
  mysql:
    image: mysql:8.0.40
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: claw_v2
      MYSQL_USER: claw_v2
      MYSQL_PASSWORD: ${V2_LOCAL_MYSQL_PASSWORD:-claw_v2_local}
      MYSQL_ROOT_PASSWORD: ${V2_LOCAL_MYSQL_ROOT_PASSWORD:-claw_v2_root_local}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:33070:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${V2_LOCAL_MINIO_USER:-clawlocal}
      MINIO_ROOT_PASSWORD: ${V2_LOCAL_MINIO_PASSWORD:-claw-local-minio-password}
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      args:
        TARGET: migrate
    entrypoint: ["/usr/local/bin/service"]
    environment: &service-environment
      TZ: Asia/Shanghai
      V2_ENV: local
      V2_LISTEN_ADDR: :8080
      V2_MYSQL_DSN: claw_v2:${V2_LOCAL_MYSQL_PASSWORD:-claw_v2_local}@tcp(mysql:3306)/claw_v2?charset=utf8mb4&parseTime=true&multiStatements=true&loc=Asia%2FShanghai
      V2_REDIS_ADDR: redis:6379
      V2_MINIO_ENDPOINT: minio:9000
      V2_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:29000
      V2_MINIO_ACCESS_KEY: ${V2_LOCAL_MINIO_USER:-clawlocal}
      V2_MINIO_SECRET_KEY: ${V2_LOCAL_MINIO_PASSWORD:-claw-local-minio-password}
      V2_MINIO_USE_TLS: "false"
      V2_MINIO_PUBLIC_USE_TLS: "false"
      V2_PUBLIC_URL: http://127.0.0.1:28080
      V2_MEDIA_BASE_URL: /claw-public
      V2_LEGACY_AUTHCODE: ${V2_LEGACY_AUTHCODE:-change-me-in-environment}
      V2_SPORTS_API_BASE_URL: ${V2_SPORTS_API_BASE_URL:-${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}}
      V2_SPORTS_API_KEY: ${V2_SPORTS_API_KEY:-${API_FOOTBALL_KEY:-}}
      V2_SPORTS_LIVE_INTERVAL: ${V2_SPORTS_LIVE_INTERVAL:-5m}
      V2_SPORTS_CATALOG_INTERVAL: ${V2_SPORTS_CATALOG_INTERVAL:-6h}
      V2_SPORTS_ODDS_INTERVAL: ${V2_SPORTS_ODDS_INTERVAL:-3h}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      args:
        TARGET: api
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  admin:
    build:
      context: ../..
      args:
        TARGET: admin
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  im:
    build:
      context: ../..
      args:
        TARGET: im
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      args:
        TARGET: scheduler
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/status"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  game:
    build:
      context: ../..
      args:
        TARGET: game
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  support:
    build:
      context: ../..
      args:
        TARGET: support
    entrypoint: ["/usr/local/bin/service"]
    environment: *service-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:28080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ../../../uniapp/dist/build/h5
        target: /usr/share/nginx/html/h5
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      im:
        condition: service_healthy
      game:
        condition: service_healthy
      support:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
