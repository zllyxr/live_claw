name: claw-rustdesk-production

x-rustdesk: &rustdesk
  # Set the complete licensed Pro reference including @sha256:... in the
  # root-owned environment file. Mutable tags and `latest` are rejected by
  # validate-rustdesk-env.sh before deployment.
  image: ${RUSTDESK_SERVER_PRO_IMAGE:?set an immutable RustDesk Server Pro image digest}
  network_mode: host
  volumes:
    - ${RUSTDESK_DATA_DIR:-/opt/claw-rustdesk/data}:/root
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  hbbs:
    <<: *rustdesk
    container_name: claw-rustdesk-hbbs
    command: hbbs
    depends_on:
      - hbbr

  hbbr:
    <<: *rustdesk
    container_name: claw-rustdesk-hbbr
    command: hbbr
