<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claw 代理后台</title>
  <link rel="stylesheet" href="/admin/static/layui/css/layui.css">
  <link rel="stylesheet" href="/admin/static/app.css?v=20260824-1">
</head>
<body class="admin-body" data-console-api-base="/agent-console/api"
      data-console-base="/agent-console" data-console-csrf-key="claw_agent_csrf"
      data-console-default-route="agent-teams">
  <aside class="sidebar">
    <div class="brand"><span>C</span> Claw 代理后台</div>
    <nav class="layui-nav layui-nav-tree">
      <div class="menu-group">代理</div>
      <a class="menu-item active" href="#agent-teams">团队前缀</a>
      <div class="menu-group">授权业务</div>
      <a class="menu-item" data-permission="games.read" href="#games">游戏管理</a>
      <a class="menu-item" data-permission="live.read" href="#live">抖音直播</a>
      <a class="menu-item" data-permission="lottery.read" href="#lottery">彩票管理</a>
      <a class="menu-item" data-permission="sports.read" href="#sports">体育管理</a>
      <a class="menu-item" data-permission="bets.read" href="#bets">投注管理</a>
      <a class="menu-item" data-permission="app.read" href="#app">App 管理</a>
    </nav>
  </aside>
  <section class="admin-shell">
    <header class="topbar">
      <div>
        <strong id="top-title">团队前缀</strong>
        <span class="environment">代理端</span>
      </div>
      <div class="account">
        <span>{{.DisplayName}}</span>
        <button class="layui-btn layui-btn-primary layui-btn-sm" id="logout">退出</button>
      </div>
    </header>
    <main class="workspace">
      <div class="page-title">
        <div>
          <h1 id="page-heading">团队前缀</h1>
          <p id="page-description">仅显示指定前缀与当前在队人数</p>
        </div>
        <div id="page-actions">
          <button class="layui-btn layui-btn-primary" id="refresh">刷新数据</button>
        </div>
      </div>
      <div id="page-content" aria-live="polite"></div>
    </main>
  </section>
  <script src="/admin/static/layui/layui.js"></script>
  <script src="/admin/static/bootstrap.js?v=20260824-1"></script>
</body>
</html>
