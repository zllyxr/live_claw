<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claw 代理后台</title>
  <link rel="stylesheet" href="/admin/static/layui/css/layui.css">
  <link rel="stylesheet" href="/admin/static/app.css?v=20260824-1">
</head>
<body class="login-body" data-console-api-base="/agent-console/api"
      data-console-base="/agent-console" data-console-csrf-key="claw_agent_csrf">
  <main class="login-card">
    <div class="login-brand">CLAW</div>
    <h1>代理后台</h1>
    <p>团队前缀与授权业务管理</p>
    <form class="layui-form" id="login-form">
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <input class="layui-input" name="username" autocomplete="username" placeholder="代理账号" required>
        </div>
      </div>
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <input class="layui-input" type="password" name="password" autocomplete="current-password" placeholder="密码" required>
        </div>
      </div>
      <button class="layui-btn layui-btn-fluid" type="submit">安全登录</button>
      <div class="login-error" id="login-error" role="alert"></div>
    </form>
  </main>
  <script src="/admin/static/layui/layui.js"></script>
  <script src="/admin/static/login.js?v=20260824-1"></script>
</body>
</html>
