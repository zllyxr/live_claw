<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claw 团队后台</title>
  <link rel="stylesheet" href="/admin/static/layui/css/layui.css">
  <link rel="stylesheet" href="/admin/static/app.css?v=20260825-1">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">CLAW</div>
    <h1>团队后台</h1>
    <p>使用代理创建的团队后台账号查看当前团队成员</p>
    <form class="layui-form" id="team-login-form">
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <input class="layui-input" name="login" autocomplete="username"
                 placeholder="团队后台账号" required>
        </div>
      </div>
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <input class="layui-input" type="password" name="password" autocomplete="current-password"
                 placeholder="密码" required>
        </div>
      </div>
      <button class="layui-btn layui-btn-fluid" type="submit">安全登录</button>
      <div class="login-error" id="team-login-error" role="alert"></div>
    </form>
  </main>
  <script src="/admin/static/team-login.js?v=20260825-1"></script>
</body>
</html>
