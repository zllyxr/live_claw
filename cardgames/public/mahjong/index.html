<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#123a2a" />
<title>麻将</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --felt-a: #16513a; --felt-b: #0a2b1f;
    --jade: #7ee0b0; --gold: #ffd869;
    --ink: #f2fff9; --fog: rgba(242,255,249,.62);
    --tw: clamp(38px, 3.7vw, 48px); --th: calc(var(--tw) * 1.36);
  }
  html, body { width: 100%; height: 100%; min-height: 100dvh; }
  body {
    position: fixed; inset: 0;
    background: radial-gradient(130% 70% at 50% 0%, #1d6b4c 0%, var(--felt-a) 45%, var(--felt-b) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 14px 6px 66px; }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: 2px; }
  .brand span { color: var(--jade); }
  .brand img { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .chips { display: flex; gap: 8px; }
  .chip {
    padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,.26);
    font-size: 11px; font-weight: 700; border: 1px solid rgba(126,224,176,.26);
  }
  .chip b { color: var(--jade); }
  .chip b.urgent { color: #d84f3e; animation: timerPulse .7s ease-in-out infinite alternate; }
  @keyframes timerPulse { to { transform: scale(1.08); text-shadow: 0 0 8px rgba(216,79,62,.45); } }

  /* 对手 */
  .rivals { display: flex; justify-content: space-around; padding: 2px 10px 0; }
  .rv {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 10px; border-radius: 12px; background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.08); min-width: 74px;
  }
  .rv.active { border-color: var(--jade); box-shadow: 0 0 0 1px var(--jade); }
  .rv .who { font-size: 11px; font-weight: 800; }
  .rv .cnt { font-size: 10px; color: var(--fog); }
  .rv .melds { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
  .mini { padding: 1px 4px; border-radius: 3px; background: rgba(255,216,105,.18); color: var(--gold); font-size: 9px; font-weight: 700; }

  /* 牌河 */
  .river-wrap {
    position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    justify-content: center; gap: 8px; padding: 6px 12px; isolation: isolate;
  }
  .river-wrap::before {
    content: ""; position: absolute; z-index: -2; left: 50%; top: 50%; width: 148px; height: 148px;
    transform: translate(-50%,-50%); opacity: .09; background: center/contain no-repeat url("../assets/gpt/mahjong-ui/east.png");
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.38));
  }
  .river-wrap::after {
    content: ""; position: absolute; z-index: -3; left: 50%; top: 50%; width: min(58vw,720px); height: 72%;
    transform: translate(-50%,-50%); border: 1px solid rgba(255,216,105,.12); border-radius: 50%;
    background: radial-gradient(ellipse,rgba(31,117,80,.22),rgba(2,26,18,.08) 70%,transparent 72%);
  }
  body.red-variant .river-wrap::before { background-image: url("../assets/gpt/mahjong-ui/red-dragon.png"); opacity: .13; }
  .river-title { font-size: 11px; color: var(--fog); text-align: center; }
  .river { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; max-height: 32vh; overflow-y: auto; }

  /* 牌 */
  .tile {
    width: var(--tw); height: var(--th); flex: 0 0 auto;
    display: block; object-fit: contain; border: 0; border-radius: 5px; background: transparent;
    box-shadow: 0 2px 5px rgba(0,0,0,.24); user-select: none;
  }
  .tile.sm { width: 26px; height: 36px; font-size: 11px; }
  .tile.wild { box-shadow: 0 0 0 2px #ffd869, 0 4px 12px rgba(255,183,42,.36); }
  .tile.hot { box-shadow: 0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,.35); }

  /* 手牌 */
  .hand-wrap { flex: 0 0 auto; padding: 0 8px calc(6px + env(safe-area-inset-bottom)); }
  .my-melds { display: flex; gap: 6px; justify-content: center; padding: 4px 0; min-height: 20px; }
  .hand { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; padding: 6px 0 4px; }
  .hand .tile { cursor: pointer; transition: transform .12s; }
  .hand .tile.on { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--jade), 0 8px 16px rgba(0,0,0,.4); }
  .hand .tile.suit-start { margin-left: 10px; }
  .hand .tile.drawn { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(225,184,82,.76); }
  .hand .tile.on.drawn { box-shadow: 0 0 0 2px var(--jade), 0 8px 16px rgba(0,0,0,.4); }

  .actions { display: flex; gap: 8px; justify-content: center; padding: 6px 0 2px; flex-wrap: wrap; }
  button {
    font: inherit; border: 0; cursor: pointer; border-radius: 999px;
    padding: 10px 22px; font-size: 14px; font-weight: 800; letter-spacing: 1px; transition: transform .12s, filter .2s;
  }
  button:active { transform: scale(.95); }
  button[disabled] { filter: grayscale(.7) brightness(.8); cursor: not-allowed; }
  .btn-main { background: linear-gradient(135deg,var(--jade),#3fb883); color: #06301f; box-shadow: 0 6px 14px rgba(63,184,131,.3); }
  .btn-gold { background: linear-gradient(135deg,var(--gold),#e8a91a); color: #3a2600; box-shadow: 0 6px 14px rgba(232,169,26,.3); }
  .btn-ghost { background: rgba(255,255,255,.12); color: var(--ink); border: 1px solid rgba(255,255,255,.22); }
  .msg { text-align: center; font-size: 12px; color: var(--fog); min-height: 16px; }

  .veil { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(3,14,9,.82); backdrop-filter: blur(5px); }
  .veil.show { display: flex; }
  .panel {
    width: 84%; max-width: 340px; padding: 26px 22px; text-align: center; border-radius: 22px;
    background: linear-gradient(165deg,#17513a,#0b2c1e); border: 1px solid rgba(126,224,176,.32); box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .panel h2 { font-size: 21px; margin-bottom: 8px; }
  .panel h2.win { color: var(--gold); }
  .panel p { font-size: 13px; color: var(--fog); line-height: 1.7; margin-bottom: 12px; }
  .pats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .pat { padding: 3px 10px; border-radius: 999px; background: rgba(255,216,105,.16); color: var(--gold); font-size: 11px; font-weight: 700; }
  .score { font-size: 30px; font-weight: 900; color: var(--gold); margin-bottom: 12px; }
  .panel .row { display: flex; gap: 10px; }
  .panel .row button { flex: 1; padding: 11px 0; font-size: 14px; }
  .note { margin-top: 12px; font-size: 11px; color: rgba(242,255,249,.4); line-height: 1.6; }
  .game-back {
    position: fixed; z-index: 80; left: calc(12px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top));
    width: 42px; height: 42px; min-width: 42px; min-height: 42px; padding: 0; display: grid; place-items: center;
    border: 1px solid rgba(255,216,105,.48); border-radius: 50%; color: var(--gold);
    background: rgba(2,24,17,.78); box-shadow: 0 7px 18px rgba(0,0,0,.32);
    font: 900 30px/1 Arial, sans-serif; backdrop-filter: blur(8px);
  }
  @media (orientation: portrait) {
    body {
      width: 100vh; height: 100vw; min-height: 0;
      transform: rotate(90deg) translateY(-100%); transform-origin: left top;
    }
  }
</style>
<link rel="stylesheet" href="../shared/rules.css" />
</head>
<body>
  <button class="game-back" type="button" onclick="returnToPlatform()" aria-label="返回">‹</button>
  <div class="top">
    <div class="brand"><img id="brandIcon" src="../assets/gpt/mahjong-ui/east.png" alt=""><span id="brandName">星域麻将</span></div>
    <div class="chips">
      <div class="chip">第 <b id="tableNo">—</b> 桌</div>
      <div class="chip">钱包 <b id="wallet">—</b></div>
      <div class="chip">剩余 <b id="wall">0</b></div>
      <div class="chip">向听 <b id="shanten">-</b></div>
      <div class="chip">计时 <b id="countdown">—</b></div>
    </div>
  </div>

  <div class="rivals" id="rivals"></div>

  <div class="river-wrap">
    <div class="river-title" id="riverTitle">牌河</div>
    <div class="river" id="river"></div>
  </div>

  <div class="hand-wrap">
    <div class="msg" id="msg"></div>
    <div class="my-melds" id="myMelds"></div>
    <div class="hand" id="hand"></div>
    <div class="actions" id="actions"></div>
  </div>

  <div class="veil" id="veil">
    <div class="panel">
      <h2 id="vTitle">提示</h2>
      <p id="vBody"></p>
      <div class="pats" id="vPats"></div>
      <div id="vScore"></div>
      <div class="row" id="vActions"></div>
      <div class="note">每局从平台钱包收取 100 星币入桌，结算后原路返还本金与输赢</div>
    </div>
  </div>
<script src="../shared/platform.js"></script>
<script src="../shared/turn-timer.js"></script>
<script src="../socket.io/socket.io.js"></script>
<script src="../shared/rules.js"></script>
<script>
const query = new URLSearchParams(location.search);
const GAME_CODE = query.get('variant') === 'red' ? 'mahjong_red' : 'mahjong';
const SOCKET_PATH = location.pathname.replace(/\/mahjong\/?$/, '') + '/socket.io';
const socket = io({ path: SOCKET_PATH, transports: ['websocket', 'polling'], autoConnect: false });
let state = null, gameId = null, picked = null;
window.notifyGameExit = () => socket.connected && socket.emit('match:leave');

const $ = (id) => document.getElementById(id);
const suitClass = (t) => t >= 27 ? 'wind' : (t < 9 ? 'wan' : t < 18 ? 'tiao' : 'tong');
const tileSuit = (t) => t >= 27 ? 3 : Math.floor(t / 9);
const sortedTilesForDisplay = (tiles, labels) => tiles
  .map((tile, originalIndex) => ({ tile, label: labels[originalIndex], originalIndex }))
  .sort((a, b) => a.tile - b.tile || a.originalIndex - b.originalIndex);
$('brandName').textContent = GAME_CODE === 'mahjong_red' ? '红中麻将' : '星域麻将';
$('brandIcon').src = GAME_CODE === 'mahjong_red'
  ? '../assets/gpt/mahjong-ui/red-dragon.png'
  : '../assets/gpt/mahjong-ui/east.png';
if (GAME_CODE === 'mahjong_red') document.body.classList.add('red-variant');
document.title = GAME_CODE === 'mahjong_red' ? '红中麻将' : '麻将';

function tileEl(tile, label, small) {
  const el = document.createElement('img');
  el.className = 'tile ' + suitClass(tile) + (small ? ' sm' : '')
    + (GAME_CODE === 'mahjong_red' && tile === 31 ? ' wild' : '');
  el.src = `../assets/gpt/mahjong-tiles-v2/tiles/${Number(tile)}.webp`;
  el.alt = label;
  el.draggable = false;
  el.title = label;
  el.dataset.tile = tile;
  return el;
}

async function call(path, body) {
  const action = path.replace(/^\//, '');
  return new Promise((resolve) => {
    socket.timeout(8000).emit('game:action', { action, ...body }, (error, result) => {
      if (error || !result?.ok) toast(result?.message || '操作失败，请重试');
      resolve(null);
    });
  });
}
const toast = (t) => { $('msg').textContent = t; };

function render() {
  if (!state) return;
  $('wall').textContent = state.wallLeft;
  $('shanten').textContent = state.shanten === 0 ? '可胡' : state.shanten;
  $('tableNo').textContent = String(state.tableNo || query.get('table') || '—').padStart(4, '0');
  $('wallet').textContent = Number(state.walletBalance || 0).toLocaleString('zh-CN');
  updateTurnTimer(state);

  // 对手
  const rv = $('rivals'); rv.innerHTML = '';
  [0, 1, 2, 3].filter((seat) => seat !== state.seat).forEach((seat) => {
    const box = document.createElement('div');
    box.className = 'rv' + (state.current === seat ? ' active' : '');
    const melds = state.melds[seat].map((m) =>
      `<span class="mini">${m.type === 'gang' ? '杠' : '碰'}${m.label}</span>`).join('');
    box.innerHTML = `<div class="who">${state.seatNames[seat]}</div>
      <div class="cnt">${state.handCounts[seat]} 张</div>
      <div class="melds">${melds}</div>`;
    rv.appendChild(box);
  });

  // 牌河（合并展示最近打出的牌）
  const river = $('river'); river.innerHTML = '';
  const all = [];
  state.discards.forEach((list, seat) => list.forEach((d) => all.push({ ...d, seat })));
  all.slice(-28).forEach((d) => river.appendChild(tileEl(d.tile, d.label, true)));
  $('riverTitle').textContent = all.length ? `牌河（${all.length} 张）` : '牌河（空）';

  // 我的副露
  const mm = $('myMelds'); mm.innerHTML = '';
  state.melds[state.seat].forEach((m) => {
    const s = document.createElement('span');
    s.className = 'mini';
    s.textContent = (m.type === 'gang' ? '杠 ' : '碰 ') + m.label;
    mm.appendChild(s);
  });

  // 手牌
  const hand = $('hand'); hand.innerHTML = '';
  const sortedHand = sortedTilesForDisplay(state.myHand, state.myHandLabels);
  const drawnEntry = state.drawnTile === null
    ? null
    : [...sortedHand].reverse().find((entry) => entry.tile === state.drawnTile);
  sortedHand.forEach((entry, displayIndex) => {
    const el = tileEl(entry.tile, entry.label);
    if (picked === entry.originalIndex) el.classList.add('on');
    if (displayIndex > 0 && tileSuit(entry.tile) !== tileSuit(sortedHand[displayIndex - 1].tile)) {
      el.classList.add('suit-start');
    }
    if (drawnEntry && entry.originalIndex === drawnEntry.originalIndex) {
      el.classList.add('drawn');
    }
    el.onclick = () => {
      picked = picked === entry.originalIndex ? null : entry.originalIndex;
      render();
    };
    hand.appendChild(el);
  });

  renderActions();
  if (state.phase === 'finished') showResult();
}

function renderActions() {
  const box = $('actions'); box.innerHTML = '';
  const add = (text, cls, fn, disabled) => {
    const b = document.createElement('button');
    b.className = cls; b.textContent = text; b.disabled = Boolean(disabled); b.onclick = fn;
    box.appendChild(b);
  };

  if (state.phase === 'finished') return;

  // 待决策：碰/杠/胡/过
  if (state.pendingClaim) {
    const c = state.pendingClaim;
    toast(`${state.seatNames[c.from]} 打出 ${c.label}`);
    if (c.canWin) add('胡', 'btn-gold', async () => { state = await call('/win', {}) || state; picked = null; render(); });
    if (c.canGang) add('杠', 'btn-main', async () => { state = await call('/gang', {}) || state; picked = null; render(); });
    if (c.canPeng) add('碰', 'btn-main', async () => { state = await call('/peng', {}) || state; picked = null; render(); });
    add('过', 'btn-ghost', async () => { state = await call('/skip', {}) || state; picked = null; render(); });
    return;
  }

  if (!state.myTurn) { toast(state.seatNames[state.current] + '正在出牌…'); return; }

  if (state.canSelfWin) {
    add('自摸', 'btn-gold', async () => { state = await call('/win', {}) || state; render(); });
  }
  state.concealedGangs.forEach((g) => {
    add('暗杠' + g.label, 'btn-main', async () => {
      state = await call('/concealed-gang', { tile: g.tile }) || state; picked = null; render();
    });
  });

  add('打出', 'btn-main', async () => {
    if (picked === null) { toast('请先选择要打出的牌'); return; }
    const tile = state.myHand[picked];
    const next = await call('/discard', { tile });
    if (next) { state = next; picked = null; }
    render();
  }, picked === null);

  if (state.waiting.length) {
    toast('听：' + state.waiting.map((w) => w.label).join(' ') + ' · 请选牌打出');
  } else {
    toast(`向听 ${state.shanten} · 请选牌打出`);
  }
}

function showResult() {
  const r = state.result; if (!r) return;
  if (r.draw) {
    $('vTitle').textContent = '流局'; $('vTitle').className = '';
    $('vBody').textContent = r.message;
    $('vPats').innerHTML = ''; $('vScore').innerHTML = '';
  } else {
    $('vTitle').textContent = r.playerWon ? '你胡了' : `${r.winnerName}胡了`;
    $('vTitle').className = r.playerWon ? 'win' : '';
    $('vBody').textContent = `${r.selfDraw ? '自摸' : '点炮'} · ${r.fan} 番`;
    $('vPats').innerHTML = r.patterns.map((p) => `<span class="pat">${p}</span>`).join('');
    $('vScore').innerHTML = `<div class="score">${r.score > 0 ? '+' : ''}${r.score} 分</div>`;
  }
  const acts = $('vActions'); acts.innerHTML = '';
  const again = document.createElement('button');
  again.className = 'btn-main'; again.textContent = '再来一局';
  again.onclick = () => {
    $('veil').classList.remove('show');
    socket.emit('match:ready', {}, (result) => {
      if (!result?.ok) toast(result?.message || '等待本局结算');
      else toast('已准备，等待同桌玩家');
    });
  };
  acts.appendChild(again);
  $('veil').classList.add('show');
}

async function start() {
  picked = null;
  toast('正在匹配牌桌…');
  if (!socket.connected) socket.connect();
}

socket.on('connect', () => {
  socket.emit('match:join', {
    game: GAME_CODE,
    uid: query.get('uid'),
    name: query.get('name'),
    ts: query.get('ts'),
    sig: query.get('sig'),
    table: query.get('table')
  }, (result) => {
    if (!result?.ok) { toast(result?.message || '匹配失败'); return; }
    $('tableNo').textContent = String(result.tableNo).padStart(4, '0');
    $('wallet').textContent = Number(result.balance || 0).toLocaleString('zh-CN');
    toast(`已进入第 ${String(result.tableNo).padStart(4, '0')} 桌，等待 ${result.requiredPlayers - result.players.length} 位玩家`);
  });
});
socket.on('match:state', (match) => {
  $('tableNo').textContent = String(match.tableNo).padStart(4, '0');
  toast(match.status === 'starting' ? '玩家已齐，正在从平台钱包入桌…' : `匹配中 ${match.players.length}/${match.requiredPlayers}`);
});
socket.on('match:error', (error) => toast(error?.message || '暂时无法开局'));
socket.on('game:state', (next) => { state = next; gameId = next.id; picked = null; render(); });
socket.on('disconnect', () => toast('连接中断，正在重连…'));

start();
</script>
</body>
</html>
