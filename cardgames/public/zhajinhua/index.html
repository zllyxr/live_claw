<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#08382a" />
  <title>炸金花</title>
  <link rel="stylesheet" href="../shared/table.css" />
  <link rel="stylesheet" href="../shared/rules.css" />
</head>
<body>
<button class="game-back" type="button" onclick="returnToPlatform()" aria-label="返回">‹</button>
<main class="app">
  <header class="topbar">
    <div class="brand">星域<b>炸金花</b></div>
    <div class="stats">
      <div class="pill">第 <b id="tableNo">—</b> 桌</div>
      <div class="pill">轮次 <b id="round">1/10</b></div>
      <div class="pill"><img src="../assets/gpt/poker-ui/chip-red.png" alt="" />底池 <b id="pot">0</b></div>
      <div class="pill">钱包 <b id="wallet">—</b></div>
      <div class="pill">计时 <b id="countdown">—</b></div>
    </div>
  </header>
  <section class="opponents" id="opponents"></section>
  <section class="table-center">
    <img class="hero-icon" src="../assets/gpt/poker-ui/dealer.png" alt="" />
    <div class="table-label">三张定胜负 · 服务端洗牌</div>
    <div class="played" id="centerCards"></div>
  </section>
  <section class="hand-zone">
    <div class="message" id="message">正在自动匹配牌桌…</div>
    <div class="hand" id="hand"></div>
    <div class="actions" id="actions"></div>
  </section>
</main>
<div class="veil" id="veil"><div class="panel">
  <img src="../assets/gpt/poker-ui/crown.png" alt="" />
  <h2 id="resultTitle">本局结束</h2><p id="resultBody"></p><div class="score" id="resultScore"></div>
  <button id="again">再来一局</button>
</div></div>
<script src="../shared/platform.js"></script>
<script src="../shared/turn-timer.js"></script>
<script src="../socket.io/socket.io.js"></script>
<script src="../shared/rules.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
