services:
  php:
    ports: !override
      - "80:80"
    environment:
      PUBLIC_LIVE_HOST: tmpai2.com
    volumes:
      - ./docker/php/admin-production.env:/var/www/html/admin/.env:ro

  core:
    ports: !override
      - "127.0.0.1:18081:8080"
    environment:
      OPENIM_PUBLIC_API_ADDRESS: /openim-api
      OPENIM_PUBLIC_WS_ADDRESS: /core-api/v1/im/ws
      CORE_HOTUPDATE_BASE_URL: https://tmpai2.com/core-api

  db:
    ports: !override
      - "127.0.0.1:18306:3306"

  redis:
    ports: !override
      - "127.0.0.1:18379:6379"

  openim-server:
    ports: !override
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"

  openim-minio:
    ports: !override
      - "127.0.0.1:10005:9000"
      - "127.0.0.1:10004:9090"

  srs:
    ports: !override
      - "127.0.0.1:19350:1935"
      - "127.0.0.1:19850:1985"
      - "127.0.0.1:18085:8080"

  fishing-game:
    ports: !override
      - "127.0.0.1:18082:3000"

  cardgames:
    ports: !override
      - "127.0.0.1:18083:3000"

  minio:
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
