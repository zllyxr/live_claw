services:
  php:
    build:
      context: ./docker/php
    container_name: claw-php80
    working_dir: /var/www/html/admin
    ports:
      - "8080:80"
      - "18080:80"
    environment:
      TZ: Asia/Shanghai
      APP_DEBUG: "0"
      APP_DEFAULT_TIMEZONE: Asia/Shanghai
      LANG_DEFAULT_LANG: zh-cn
      DATABASE_DRIVER: mysql
      DATABASE_TYPE: mysql
      DATABASE_HOSTNAME: db
      DATABASE_DATABASE: claw_live
      DATABASE_USERNAME: claw
      DATABASE_PASSWORD: ${MYSQL_APP_PASSWORD:-claw_dev_pwd}
      DATABASE_HOSTPORT: "3306"
      DATABASE_CHARSET: utf8mb4
      DATABASE_PREFIX: cmf_
      REDIS_HOST: redis
      REDIS_AUTH: ""
      REDIS_PORT: "6379"
      PUBLIC_LIVE_HOST: ${PUBLIC_LIVE_HOST:-192.168.31.187}
      VIRTUAL_LIVE_DELIVERY_MODE: direct
      VIRTUAL_LIVE_MAX_ACTIVE: "300"
      BEPUSDT_API_URL: http://host.docker.internal:18088
      BEPUSDT_API_TOKEN: ${BEPUSDT_API_TOKEN:-}
      BEPUSDT_TRADE_TYPE: usdt.trc20
      BEPUSDT_FIAT: USD
      BEPUSDT_TIMEOUT: "1200"
    volumes:
      - ./admin:/var/www/html/admin
      - ./uniapp/dist/build/h5:/var/www/html/admin/public/h5:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  core:
    build:
      context: ./services/core
    container_name: claw-core-go
    environment:
      TZ: Asia/Shanghai
      CORE_LISTEN_ADDR: :8080
      CORE_MYSQL_DSN: claw:${MYSQL_APP_PASSWORD:-claw_dev_pwd}@tcp(db:3306)/claw_live?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
      CORE_REDIS_ADDR: redis:6379
      CORE_LOTTERY_TICK: 500ms
      CORE_SPORTS_COLLECT_INTERVAL: 60s
      CORE_SPORTS_CATALOG_INTERVAL: 15m
      CORE_SPORTS_ODDS_INTERVAL: 30m
      SPORTS_API_KEY: ${API_FOOTBALL_KEY:-}
      SPORTS_API_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      OPENIM_API_URL: http://openim-server:10002
      OPENIM_GATEWAY_URL: http://openim-server:10001
      OPENIM_SECRET: ${OPENIM_SECRET:-openIM123}
      OPENIM_ADMIN_USER_ID: imAdmin
      OPENIM_PUBLIC_API_ADDRESS: /openim-api
      OPENIM_PUBLIC_WS_ADDRESS: /core-api/v1/im/ws
      CORE_HOTUPDATE_DIR: /data/wgt
      CORE_HOTUPDATE_BASE_URL: ${CORE_HOTUPDATE_BASE_URL:-http://127.0.0.1:18080/core-api}
      CORE_MINIGAME_SECRET: ${MINIGAME_SECRET:-claw_minigame_dev_secret}
      CORE_MINIGAME_TABLE_COUNT: "1000"
    ports:
      - "18081:8080"
    volumes:
      - ./release/wgt:/data/wgt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: claw-mysql80
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+08:00
    ports:
      - "18306:3306"
    environment:
      MYSQL_DATABASE: claw_live
      MYSQL_USER: claw
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-claw_dev_pwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-claw_root_pwd}
      TZ: Asia/Shanghai
    volumes:
      - claw_mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-claw-public-seed.sql:/docker-entrypoint-initdb.d/01-live.sql:ro
      - ./docker/mysql/init/02-core-rebuild.sql:/docker-entrypoint-initdb.d/02-core-rebuild.sql:ro
      - ./docker/mysql/init/03-live-source-room-pool.sql:/docker-entrypoint-initdb.d/03-live-source-room-pool.sql:ro
      - ./docker/mysql/init/04-virtual-live-fleet.sql:/docker-entrypoint-initdb.d/04-virtual-live-fleet.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: claw-redis7
    ports:
      - "18379:6379"
    volumes:
      - claw_redis_data:/data
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped

  openim-mongo:
    image: mongo:7.0
    container_name: claw-openim-mongo
    command: mongod --wiredTigerCacheSizeGB 1 --auth
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${OPENIM_MONGO_PASSWORD:-openIM123}
      MONGO_INITDB_DATABASE: openim_v3
    volumes:
      - claw_openim_mongo_data:/data/db
    restart: unless-stopped

  openim-redis:
    image: redis:7.0.0
    container_name: claw-openim-redis
    command: redis-server --requirepass ${OPENIM_REDIS_PASSWORD:-openIM123} --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - claw_openim_redis_data:/data
    restart: unless-stopped

  openim-etcd:
    image: bitnamilegacy/etcd:3.5.13
    container_name: claw-openim-etcd
    environment:
      TZ: Asia/Shanghai
      ETCD_NAME: s1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://openim-etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://openim-etcd:2380
      ETCD_INITIAL_CLUSTER: s1=http://openim-etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: claw-openim
      ETCD_INITIAL_CLUSTER_STATE: new
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - claw_openim_etcd_data:/etcd-data
    restart: unless-stopped

  openim-kafka:
    image: bitnamilegacy/kafka:3.5.1
    container_name: claw-openim-kafka
    user: root
    environment:
      TZ: Asia/Shanghai
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@openim-kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://openim-kafka:9092,EXTERNAL://openim-kafka:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - claw_openim_kafka_data:/bitnami/kafka
    restart: unless-stopped

  openim-minio:
    image: minio/minio:RELEASE.2024-01-11T07-46-16Z
    container_name: claw-openim-minio
    command: server /data --console-address ":9090"
    ports:
      - "10005:9000"
      - "10004:9090"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ${OPENIM_MINIO_PASSWORD:-openIM123}
    volumes:
      - claw_openim_minio_data:/data
    restart: unless-stopped

  openim-server:
    image: ${OPENIM_SERVER_IMAGE:-openim/openim-server:v3.8.3-patch.12}
    container_name: claw-openim-server
    init: true
    ports:
      - "10001:10001"
      - "10002:10002"
    environment:
      IMENV_MONGODB_ADDRESS: openim-mongo:27017
      IMENV_MONGODB_USERNAME: root
      IMENV_MONGODB_PASSWORD: ${OPENIM_MONGO_PASSWORD:-openIM123}
      IMENV_MONGODB_AUTHSOURCE: admin
      IMENV_KAFKA_ADDRESS: openim-kafka:9094
      IMENV_DISCOVERY_ETCD_ADDRESS: openim-etcd:2379
      IMENV_REDIS_ADDRESS: openim-redis:6379
      IMENV_REDIS_PASSWORD: ${OPENIM_REDIS_PASSWORD:-openIM123}
      IMENV_MINIO_INTERNALADDRESS: openim-minio:9000
      IMENV_MINIO_EXTERNALADDRESS: ${OPENIM_MINIO_EXTERNAL_ADDRESS:-http://127.0.0.1:10005}
      IMENV_MINIO_ACCESSKEYID: root
      IMENV_MINIO_SECRETACCESSKEY: ${OPENIM_MINIO_PASSWORD:-openIM123}
      IMENV_SHARE_SECRET: ${OPENIM_SECRET:-openIM123}
      IMENV_LOG_ISSTDOUT: "true"
      IMENV_LOG_REMAINLOGLEVEL: "3"
    depends_on:
      - openim-mongo
      - openim-redis
      - openim-etcd
      - openim-kafka
      - openim-minio
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    container_name: claw-srs
    ports:
      - "19350:1935"
      - "18085:8080"
      - "19850:1985"
    environment:
      # SRS image lacks zoneinfo data; POSIX TZ keeps it on UTC+8.
      TZ: CST-8
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: claw-minio
    command: server /data --console-address ":9001"
    profiles:
      - minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - claw_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: claw-minio-init
    profiles:
      - minio
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 2
        done
        mc mb -p local/claw-live || true
        mc anonymous set download local/claw-live || true

  fishing-game:
    build:
      context: ./game
    container_name: claw-fishing-game
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      MAX_ROOMS: "1000"
      TARGET_RTP: "0.72"
      MINIGAME_SECRET: ${MINIGAME_SECRET:-claw_minigame_dev_secret}
      CORE_INTERNAL_URL: http://core:8080
      # 与 Apache 反代路径保持一致，保证静态资源与 socket.io 前缀正确
      BASE_PATH: /minigame/fish
    ports:
      - "18082:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  cardgames:
    build:
      context: ./cardgames
    container_name: claw-cardgames
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      MINIGAME_SECRET: ${MINIGAME_SECRET:-claw_minigame_dev_secret}
      CORE_INTERNAL_URL: http://core:8080
      BOT_FILL_ENABLED: ${BOT_FILL_ENABLED:-1}
      BOT_FILL_DELAY_MS: ${BOT_FILL_DELAY_MS:-1500}
      BOT_ACTION_MIN_MS: ${BOT_ACTION_MIN_MS:-900}
      BOT_ACTION_MAX_MS: ${BOT_ACTION_MAX_MS:-2600}
      HUMAN_TURN_TIMEOUT_MS: ${HUMAN_TURN_TIMEOUT_MS:-15000}
      HUMAN_CLAIM_TIMEOUT_MS: ${HUMAN_CLAIM_TIMEOUT_MS:-8000}
      # 与 Apache 反代路径一致
      BASE_PATH: /minigame/cards
    ports:
      - "18083:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  claw_mysql_data:
  claw_redis_data:
  claw_minio_data:
  claw_openim_mongo_data:
  claw_openim_redis_data:
  claw_openim_etcd_data:
  claw_openim_kafka_data:
  claw_openim_minio_data:
