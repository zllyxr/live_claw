<VirtualHost *:80>
    ServerName tmpai2.com
    ServerAlias www.tmpai2.com api.tmpai2.com live.tmpai2.com
    DocumentRoot /var/www/html/admin/public

    ProxyPreserveHost On
    # 根域名直接内部落到 H5 首页，避免上游终止 TLS 时产生 http 降级跳转。
    RewriteEngine On
    RewriteRule ^/?$ /h5/index.html [END]

    # ---------- 小游戏 ----------
    # 深海猎手：socket.io 的 WebSocket 升级必须写在普通 ProxyPass 之前
    ProxyPass        /minigame/fish/socket.io/ ws://fishing-game:3000/minigame/fish/socket.io/
    ProxyPassReverse /minigame/fish/socket.io/ ws://fishing-game:3000/minigame/fish/socket.io/
    ProxyPass        /minigame/fish/ http://fishing-game:3000/minigame/fish/
    ProxyPassReverse /minigame/fish/ http://fishing-game:3000/minigame/fish/

    # 牌类游戏：实时匹配与出牌依赖 Socket.IO WebSocket。
    # 升级路径必须写在普通 HTTP 代理之前，否则 Apache 会返回 400，
    # 前端会一直停留在“正在匹配牌桌”且服务端无法触发机器人补位。
    ProxyPass        /minigame/cards/socket.io/ ws://cardgames:3000/minigame/cards/socket.io/
    ProxyPassReverse /minigame/cards/socket.io/ ws://cardgames:3000/minigame/cards/socket.io/
    ProxyPass        /minigame/cards/ http://cardgames:3000/minigame/cards/
    ProxyPassReverse /minigame/cards/ http://cardgames:3000/minigame/cards/
    ProxyPass        /core-api/v1/im/ws ws://core:8080/v1/im/ws
    ProxyPassReverse /core-api/v1/im/ws ws://core:8080/v1/im/ws
    ProxyPass        /core-api/ http://core:8080/
    ProxyPassReverse /core-api/ http://core:8080/
    ProxyPass        /openim-api/ http://openim-server:10002/
    ProxyPassReverse /openim-api/ http://openim-server:10002/
    ProxyPass        /openim-ws ws://openim-server:10001
    ProxyPassReverse /openim-ws ws://openim-server:10001

    # ---------- 直播播放 ----------
    # HLS 与 H5 页面保持同域，避免移动端浏览器拦截跨端口媒体请求。
    ProxyPass        /live/ http://srs:8080/live/
    ProxyPassReverse /live/ http://srs:8080/live/

    <Directory /var/www/html/admin/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php index.html

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php?s=/$1 [QSA,L]
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" claw_noquery
    CustomLog ${APACHE_LOG_DIR}/access.log claw_noquery
</VirtualHost>

# OpenIM 对象存储使用独立子域名，避免在前端暴露 MinIO 管理端口。
# TLS 由上游代理终止，本机只接收 HTTP。
<VirtualHost *:80>
    ServerName media.tmpai2.com

    ProxyPreserveHost On
    ProxyPass        / http://openim-minio:9000/
    ProxyPassReverse / http://openim-minio:9000/

    ErrorLog ${APACHE_LOG_DIR}/media-error.log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" claw_media_noquery
    CustomLog ${APACHE_LOG_DIR}/media-access.log claw_media_noquery
</VirtualHost>
